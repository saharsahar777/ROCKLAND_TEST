<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rock Land — прототип</title>
  <style>
    @font-face {
      font-family: 'PressStart2P';
      src: url('assets/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --cell-size: 64px;
      --pad-size: 54px;
      --pad-gap: 5px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #26362d; font-family: 'PressStart2P', monospace; touch-action: none;
    }
    #game { position: fixed; inset: 0; overflow: hidden; background: #26362d; }

    #terrain-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center;
    }
    .cell {
      width: var(--cell-size); height: var(--cell-size);
      background-size: calc(100% + 1px) calc(100% + 1px); background-position: center; background-repeat: no-repeat;
      image-rendering: pixelated;
      /* Перекрываем субпиксельные щели между тайлами при движении камеры. */
    }

    #objects-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center; pointer-events: none;
    }
    .object-cell {
      position: relative; width: var(--cell-size); height: var(--cell-size);
      pointer-events: none;
    }
    .world-object {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      image-rendering: pixelated; object-fit: contain; max-width: none;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }
    .world-object.tree-1 { width: 64px; height: 128px; }
    .world-object.tree-2 { width: 128px; height: 64px; }
    .world-object.rock { width: 64px; height: 64px; }
    .world-object.spring { width: 64px; height: 64px; }
    .workbench-marker {
      position:absolute; left:50%; bottom:-8px;
      width:64px; height:64px;
      transform:translateX(-50%);
      object-fit:contain; image-rendering:pixelated;
      pointer-events:none; z-index:5;
    }
    /* Сдвиг компенсирует прозрачный отступ снизу в PNG: видимое основание касается нижнего края ячейки. */
    /* Верстак и наковальня уменьшены на 25%, основание выровнено по нижнему краю ячейки. */
    .workbench-marker.workbench,
    .workbench-marker.anvil {
      width:48px; height:48px;
    }
    #placement-preview { position:absolute; width:64px; height:64px; display:none; border:3px solid #e33; background:rgba(235,35,35,.28); box-shadow:inset 0 0 0 1px #fff8; pointer-events:none; z-index:100000; }
    #placement-preview.valid { border-color:#35e65b; background:rgba(35,220,75,.28); }

    #actors-layer { position: absolute; inset: 0; pointer-events: none; }
    .good-mob, .evil-mob { position:absolute; width:64px; height:64px; transform:translate(-50%, -50%); object-fit:contain; image-rendering:pixelated; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    #player {
      position: absolute; left: 0; top: 0; width: 64px; height: 64px;
      transform: translate(-50%, -50%); image-rendering: pixelated;
      object-fit: contain; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .28));
      will-change: contents;
    }

    #controls {
      position: absolute; z-index: 5;
      left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, var(--pad-size));
      grid-template-rows: repeat(2, var(--pad-size)); gap: var(--pad-gap);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .direction {
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #d4d4d4; border-radius: 5px;
      background: rgba(210, 210, 210, .88); color: #424242;
      font-size: 26px; line-height: 1; box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
      cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .direction:active { background: #f0f0f0; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    /* Схематичный интерфейс: быстрые слоты, инвентарь и действие. */
    #world-controls { position:absolute; z-index:8; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); display:flex; gap:6px; }
    #world-controls button { border:1px solid #d4d4d4; border-radius:4px; padding:8px 9px; background:rgba(70,85,72,.94); color:#fff; font:7px/1.5 'PressStart2P',monospace; cursor:pointer; }
    #quick-slots {
      position: absolute; z-index: 7; left: max(12px, env(safe-area-inset-left));
      top: 50%; transform: translateY(-50%); display: grid; gap: 5px;
    }
    .item-slot {
      width: 48px; height: 48px; border: 2px solid #aaa; border-radius: 4px;
      background: rgba(125,125,125,.88); color: #fff; display: flex;
      align-items: center; justify-content: center; position: relative;
      font: 8px 'PressStart2P', monospace; text-shadow: 0 1px 2px #222;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .item-slot.selected { border: 3px solid #f2d45c; background: rgba(155,155,155,.96); }
    .slot-number { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #eee; }
    .slot-count { position: absolute; right: 3px; bottom: 2px; font-size: 11px; }
    .item-icon { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    #inventory-grid .item-icon { width: 34px; height: 34px; }
    .durability-track { position:absolute; left:5px; right:5px; bottom:4px; height:5px; background:#292929; border:1px solid #111; border-radius:2px; overflow:hidden; }
    .durability-fill { display:block; height:100%; }
    .durability-value { position:absolute; left:0; right:0; bottom:10px; color:#fff; font:8px monospace; text-shadow:1px 1px #000; text-align:center; pointer-events:none; }
    #inventory-open {
      position: absolute; z-index: 7; top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 25px; cursor: pointer;
    }
    #craft-open {
      position: absolute; z-index: 7; top: calc(max(14px, env(safe-area-inset-top)) + var(--pad-size) + 8px);
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 23px; cursor: pointer;
    }
    #craft-open {
      position: absolute; z-index: 7; top: calc(max(14px, env(safe-area-inset-top)) + var(--pad-size) + 8px);
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 23px; cursor: pointer;
    }
    #dev-open {
      position: absolute; z-index: 7;
      top: calc(max(14px, env(safe-area-inset-top)) + var(--pad-size) + 8px + var(--pad-size) + 8px);
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(95,115,98,.94);
      color: #fff; font-size: 22px; cursor: pointer;
    }
    #dev-overlay {
      display: none; position: absolute; z-index: 22; inset: 0; background: rgba(0,0,0,.68);
      align-items: center; justify-content: center; padding: 16px;
    }
    #dev-overlay.open { display: flex; }
    #dev-window {
      width: min(600px, 100%); max-height: 90%; overflow: auto; padding: 14px;
      background: #686868; color: #fff; border: 2px solid #aaa; border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #dev-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    #dev-header strong { font-size:10px; line-height:1.8; }
    #dev-close { width:32px; height:32px; border:1px solid #ccc; border-radius:4px; background:#999; font-size:20px; }
    #dev-categories { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-bottom:12px; }
    .dev-category { min-height:38px; padding:6px 4px; border:1px solid #aaa; border-radius:3px; background:#454545; color:#fff; font:7px/1.5 'PressStart2P',monospace; cursor:pointer; }
    .dev-category.active { background:#8b8b8b; border-color:#f2d45c; color:#fff; }
    #dev-items { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:8px; }
    .dev-item { min-height:94px; padding:8px 5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; border:1px solid #aaa; border-radius:4px; background:#858585; color:#fff; font:7px/1.6 'PressStart2P',monospace; text-align:center; cursor:pointer; }
    .dev-item:active { background:#555; transform:translateY(1px); }
    .dev-item img { width:40px; height:40px; object-fit:contain; image-rendering:pixelated; }
    .dev-item-icon { width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:25px; }
    #dev-hint { margin-top:10px; color:#eee; font:7px/1.7 'PressStart2P',monospace; }
    @media (max-width:480px) {
      #dev-window { padding:10px; }
      #dev-items { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; }
      .dev-item { min-height:86px; font-size:6px; }
      #dev-categories { gap:4px; }
      .dev-category { font-size:6px; }
    }
    #craft-overlay {
      display: none; position: absolute; z-index: 21; inset: 0; background: rgba(0,0,0,.62);
      align-items: center; justify-content: center; padding: 16px;
    }
    #craft-overlay.open { display: flex; }
    #craft-window {
      width: min(560px, 100%); max-height: 90%; overflow: auto; padding: 14px;
      background: #777; color: #fff; border: 2px solid #aaa; border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #craft-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    #craft-header strong { font-size: 10px; line-height: 1.8; }
    #craft-close { width:32px; height:32px; border:1px solid #ccc; border-radius:4px; background:#999; font-size:20px; }
    .craft-section-title {
      margin: 14px 0 9px; padding: 8px 10px; background: #555;
      border: 1px solid #aaa; color: #fff; font: 9px/1.8 'PressStart2P',monospace;
    }
    .craft-recipe {
      background: #929292; border: 2px solid #bcbcbc; border-radius: 4px;
      padding: 12px; margin-bottom: 10px; color: #fff;
    }
    .craft-recipe-title { font-size: 9px; line-height: 1.8; margin-bottom: 10px; }
    .craft-recipe-body { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .craft-ingredient {
      min-width: 64px; display:flex; flex-direction:column; align-items:center; gap:5px;
      padding:6px; background:rgba(40,40,40,.28); border:1px solid rgba(255,255,255,.2);
      font: 8px 'PressStart2P', monospace;
    }
    .craft-ingredient img { width:34px; height:34px; object-fit:contain; image-rendering:pixelated; }
    .craft-plus { font: 12px 'PressStart2P', monospace; }
    .craft-create {
      margin-left:auto; min-height:42px; padding:8px 12px; border:1px solid #555; border-radius:4px;
      background:#383838; color:#fff; font: 8px/1.7 'PressStart2P',monospace; cursor:pointer;
    }
    .craft-create:active { background:#222; transform:translateY(1px); }
    .craft-create img { width:22px; height:22px; object-fit:contain; vertical-align:middle; }
    @media (max-width:480px) {
      #craft-window { padding:10px; }
      .craft-recipe { padding:9px; }
      .craft-recipe-body { gap:6px; }
      .craft-create { width:100%; margin:4px 0 0; }
    }
    #action-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #interact-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--pad-size) + 10px);
      width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #eat-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + (var(--pad-size) * 2) + 20px);
      width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #action-feedback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 28px; }
    #action-button.hit #action-feedback { display: flex; }
    #action-button.hit #action-label { display: none; }
    #health-panel {
      position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px;
      background: rgba(0,0,0,.48); padding: 7px 9px; border-radius: 5px;
    }
    .status-row { display: flex; align-items: center; gap: 7px; }
    .status-icon { width: 18px; text-align: center; font: 16px Arial,sans-serif; }
    .status-track { width: 112px; height: 8px; overflow: hidden; background: rgba(255,255,255,.22); border-radius: 5px; }
    .status-fill { height: 100%; width: 100%; border-radius: inherit; transition: width .15s linear; }
    #health-fill { background: #e34d68; }
    #hunger-fill { background: #d69a43; }
    #thirst-fill { background: #49a9df; }
    /* Fallout-подобная лента системных сообщений внизу экрана. */
    #message-log {
      /* Уведомления должны быть поверх окон инвентаря и крафта. */
      position: absolute; z-index: 30; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(620px, calc(100% - 150px));
      display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 7px;
      pointer-events: none;
    }
    .game-message {
      max-width: 100%; padding: 9px 12px; color: #eee;
      background: rgba(8, 10, 9, .86); border: 2px solid #777;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.7), 0 3px 8px rgba(0,0,0,.45);
      font: 9px/1.7 'PressStart2P', monospace; text-shadow: 1px 1px #000;
      overflow-wrap: anywhere; animation: message-in .12s ease-out;
    }
    .game-message.damage { color: #ff5555; border-color: #a43b3b; }
    .game-message.resource { color: #75e078; border-color: #438a49; }
    @keyframes message-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      #message-log { width: calc(100% - 120px); bottom: 90px; }
      .game-message { font-size: 7px; padding: 7px 8px; }
    }
    #death-overlay {
      display: none; position: absolute; z-index: 50; inset: 0;
      background: rgba(0,0,0,.78); align-items: center; justify-content: center; padding: 18px;
    }
    #death-overlay.open { display: flex; }
    #death-window {
      width: min(360px, 100%); padding: 26px 20px; text-align: center;
      color: #f2f2f2; background: #292929; border: 3px solid #888;
      box-shadow: 0 10px 35px rgba(0,0,0,.65); border-radius: 5px;
      font-family: 'PressStart2P', monospace;
    }
    #death-window h2 { margin: 0 0 24px; font-size: 18px; line-height: 1.7; }
    #respawn-button {
      border: 2px solid #ddd; border-radius: 4px; padding: 13px 18px;
      color: #fff; background: #555; font: 10px 'PressStart2P', monospace; cursor: pointer;
    }
    #respawn-button:active { background: #777; transform: translateY(1px); }
    #inventory-overlay {
      display: none; position: absolute; z-index: 20; inset: 0; background: rgba(0,0,0,.55);
      align-items: center; justify-content: center; padding: 16px;
    }
    #inventory-overlay.open { display: flex; }
    #inventory-window {
      width: min(390px, 100%); max-height: min(560px, 92%); overflow: auto;
      background: #777; border: 2px solid #aaa; border-radius: 6px; padding: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45); color: white;
    }
    #inventory-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #inventory-header strong { font-size: 18px; }
    #inventory-close { width: 32px; height: 32px; border: 1px solid #ccc; border-radius: 4px; background: #999; font-size: 20px; }
    #inventory-quick, #inventory-grid { display: grid; grid-template-columns: repeat(4, 48px); gap: 7px; justify-content: center; }
    #inventory-quick { margin-bottom: 14px; }
    #inventory-grid { grid-template-columns: repeat(4, minmax(48px, 1fr)); }
    #inventory-grid .item-slot { width: 100%; max-width: 64px; height: 52px; justify-self: center; }
    @media (max-width: 480px) {
      :root { --pad-size: 48px; --pad-gap: 4px; }
      .item-slot { width: 42px; height: 42px; }
      #quick-slots { gap: 4px; }
      #inventory-quick { grid-template-columns: repeat(4, 42px); }
    }

    #world-menu { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(20,31,25,.97); color:#fff; overflow:auto; }
    #world-menu[hidden] { display:none; }
    #world-menu-panel { width:min(620px,100%); max-height:94vh; overflow:auto; padding:18px; background:#4e5c50; border:3px solid #aab5a9; box-shadow:0 10px 35px #0009; }
    #world-menu h1 { margin:0 0 10px; text-align:center; font-size:clamp(16px,4vw,24px); }
    #world-menu-subtitle { text-align:center; color:#d6dfd4; font-size:9px; line-height:1.8; margin-bottom:18px; }
    .world-slot { padding:12px; margin:9px 0; border:2px solid #aab5a9; background:#667367; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .world-slot-info { min-width:0; flex:1; }
    .world-slot-name { font-size:10px; line-height:1.8; overflow-wrap:anywhere; }
    .world-slot-meta { color:#dce4dc; font:9px/1.8 Arial,sans-serif; margin-top:5px; }
    .world-slot-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .world-menu-button { border:1px solid #d6dfd4; border-radius:3px; padding:9px 10px; background:#303c32; color:white; font:8px/1.6 'PressStart2P',monospace; cursor:pointer; }
    .world-menu-button:disabled { opacity:.45; cursor:not-allowed; }
    .world-menu-button.danger { background:#713d39; }
    #world-menu-status { min-height:22px; margin-top:10px; color:#f3e6a2; font:9px/1.8 Arial,sans-serif; text-align:center; }
    #world-name-dialog { display:none; margin-top:14px; padding:12px; background:#39463b; border:1px solid #aab5a9; }
    #world-name-dialog.open { display:block; }
    #world-name-input { width:100%; padding:10px; margin:8px 0; font:12px Arial,sans-serif; }
  
    .floating-effect-number {
      position: absolute;
      z-index: 100000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: 'PressStart2P', monospace;
      font-size: 13px;
      line-height: 1;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 2px 2px 0 #171717, -1px -1px 0 #171717, 1px -1px 0 #171717, -1px 1px 0 #171717;
      animation: floating-number-rise 850ms ease-out forwards;
    }
    .floating-effect-number.negative { color: #ff4545; }
    .floating-effect-number.positive { color: #45f06b; }
    @keyframes floating-number-rise {
      0% { opacity: 0; transform: translate(-50%, 0) scale(.82); }
      12% { opacity: 1; }
      72% { opacity: 1; transform: translate(-50%, -30px) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(1); }
    }

    .hit-effect-sprite {
      position: absolute;
      z-index: 4;
      width: 96px;
      height: 96px;
      object-fit: contain;
      image-rendering: pixelated;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      transform: translate(-50%, -50%) scale(.82);
      opacity: 1;
      animation: hit-effect-fade 260ms ease-out forwards;
    }
    @keyframes hit-effect-fade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(.82); }
      35% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.04); }
    }
</style>
</head>
<body>

  <section id="world-menu" hidden aria-label="Выбор мира">
    <div id="world-menu-panel">
      <h1>ROCK LAND</h1>
      <div id="world-menu-subtitle">ВЫБЕРИ МИР ИЛИ СОЗДАЙ НОВЫЙ</div>
      <div id="world-slots"></div>
      <div id="world-menu-status" role="status"></div>
      <div id="world-name-dialog">
        <label for="world-name-input" style="font:9px/1.8 'PressStart2P',monospace">НАЗВАНИЕ НОВОГО МИРА</label>
        <input id="world-name-input" type="text" maxlength="32" placeholder="Мой мир">
        <button class="world-menu-button" id="world-create-confirm" type="button">СОЗДАТЬ</button>

    <div id="objects-layer" aria-hidden="true"></div>

      <div class="status-row" title="Голод"><span class="status-icon">🍗</span><div class="status-track"><div class="status-fill" id="hunger-fill"></div></div></div>

      <span id="action-label">✊</span><span id="action-feedback">💢</span>

      <section id="death-window">
        <h2 id="death-title">ВЫ ПОГИБЛИ</h2>
        <button id="respawn-button" type="button">ВОЗРОДИТЬСЯ</button>
      </section>
    </div>
    <div id="inventory-overlay" role="dialog" aria-modal="true" aria-label="Инвентарь">
      <section id="inventory-window">
        <div id="inventory-header"><strong>Инвентарь</strong><button id="inventory-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="inventory-quick" aria-label="Быстрые слоты в инвентаре"></div>
        <div id="inventory-grid" aria-label="16 ячеек инвентаря"></div>
      </section>
    </div>
    <div id="craft-overlay" role="dialog" aria-modal="true" aria-label="Крафт">
      <section id="craft-window">
        <div id="craft-header"><strong>Верстак — меню крафта</strong><button id="craft-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="craft-recipes"></div>
      </section>
    </div>

      <section id="dev-window">
        <div id="dev-header"><strong>МЕНЮ РАЗРАБОТЧИКА</strong><button id="dev-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="dev-categories" aria-label="Категории предметов"></div>
        <div id="dev-items" aria-live="polite"></div>
        <div id="dev-hint">НАЖМИ НА ПРЕДМЕТ, ЧТОБЫ ДОБАВИТЬ ЕГО В ИНВЕНТАРЬ</div>
      </section>
    </div>
  </main>

  <script>
    const terrainLayer = document.getElementById('terrain-layer');
    const objectsLayer = document.getElementById('objects-layer');
    const player = document.getElementById('player');
    // Игрок находится в общем слое объектов для динамической сортировки по глубине.
    objectsLayer.appendChild(player);
    const placementPreview = document.createElement('div');
    placementPreview.id = 'placement-preview';
    objectsLayer.appendChild(placementPreview);

    // Инвентарь: быстрые слоты и 16 ячеек используют одни и те же предметы.
    const quickSlots = [null, null, null, null];
    const inventoryItems = [];
    let selectedQuickSlot = 0;
    let health = 100;
    let isPlayerDead = false;
    let respawnX = null;
    let respawnY = null;
    let hunger = 100;
    let hungerElapsed = 0;
    let starvationDamageElapsed = 0;
    let starvationMessageShown = false;
    let thirst = 100;
    let thirstElapsed = 0;
    let dehydrationDamageElapsed = 0;
    let dehydrationMessageShown = false;
    const MAX_HEALTH = 100;
    const MAX_HUNGER = 100;
    const HUNGER_TICK_SECONDS = 30;
    const HUNGER_LOSS = 5;
    const STARVATION_DAMAGE_INTERVAL = 30;
    const STARVATION_DAMAGE = 10;
    const MAX_THIRST = 100;
    const THIRST_TICK_SECONDS = 30;
    const THIRST_LOSS = 10;
    const DEHYDRATION_DAMAGE_INTERVAL = 15;
    const DEHYDRATION_DAMAGE = 10;
    let activeWorldId = null;
    let activeWorldName = '';
    let saveDatabase = null;
    let saveDirty = false;
    let saveInProgress = false;
    let lastSavedAt = 0;
    let autoSaveTimer = null;
    let saveDebounceTimer = null;
    const MAX_WORLDS = 5;
    const SAVE_INTERVAL_MS = 60000;
    const SAVE_DB_NAME = 'RockLandSaveDB';
    const SAVE_DB_VERSION = 1;
    const RESOURCE_NAMES = { wood: 'Древесина', stone: 'Камень', coal: 'Уголь', iron_ore: 'Железная руда', iron_ingot: 'Железный слиток', steel_ingot: 'Стальной слиток', raw_pork: 'Сырая свинина', cooked_pork: 'Жареная свинина', cloth: 'Ткань', dagger: 'Кинжал' };
    const RESOURCE_ICONS = { wood: 'assets/wood_1.png', stone: 'assets/stone_1.png', coal: 'assets/coal_1.png', iron_ore: 'assets/iron_ore_1.png', iron_ingot: 'assets/iron_ingot_1.png', steel_ingot: 'assets/steel_ingot_1.png', raw_pork: 'assets/food/pork_1.png', cooked_pork: 'assets/food/pork_2.png', cloth: 'assets/cloth_1.png', dagger: 'assets/tools/dagger_1.png' };
    // Инструменты и оружие имеют индивидуальную прочность: 100 единиц при создании.
    const TOOL_DEFINITIONS = {
      stone_axe: { id: 'stone_axe', name: 'Каменный топор', toolFor: 'tree', tier: 1, yield: 1, icon: 'assets/tools/axe_1.png' },
      iron_axe: { id: 'iron_axe', name: 'Железный топор', toolFor: 'tree', tier: 2, yield: 2, icon: 'assets/tools/axe_2.png' },
      steel_axe: { id: 'steel_axe', name: 'Стальной топор', toolFor: 'tree', tier: 3, yield: 3, icon: 'assets/tools/axe_3.png' },
      stone_pickaxe: { id: 'stone_pickaxe', name: 'Каменная кирка', toolFor: 'rock', tier: 1, yield: 1, icon: 'assets/tools/pickaxe_1.png' },
      iron_pickaxe: { id: 'iron_pickaxe', name: 'Железная кирка', toolFor: 'rock', tier: 2, yield: 2, icon: 'assets/tools/pickaxe_2.png' },
      steel_pickaxe: { id: 'steel_pickaxe', name: 'Стальная кирка', toolFor: 'rock', tier: 3, yield: 3, icon: 'assets/tools/pickaxe_3.png' }
    };
    const WEAPON_DEFINITIONS = {
      iron_sword: { id: 'iron_sword', name: 'Железный меч', damage: 20, icon: 'assets/tools/iron_sword_1.png', category: 'weapon' },
      steel_sword: { id: 'steel_sword', name: 'Стальной меч', damage: 30, icon: 'assets/tools/steel_sword_1.png', category: 'weapon' },
      dagger: { id: 'dagger', name: 'Кинжал', damage: 15, icon: 'assets/tools/dagger_1.png', category: 'weapon' }
    };
    const BUILDING_DEFINITIONS = {
      workbench: { id: 'workbench', name: 'Верстак', icon: 'assets/buildings/workbench_1.png', type: 'building' },
      furnace: { id: 'furnace', name: 'Горн', icon: 'assets/buildings/Bloomery_1.png', type: 'building' },
      anvil: { id: 'anvil', name: 'Наковальня', icon: 'assets/buildings/anvil_1.png', type: 'building' }
    };
    const MAX_STACK_SIZE = 50;
    const inventoryOverlay = document.getElementById('inventory-overlay');
    const quickSlotsElement = document.getElementById('quick-slots');
    const inventoryQuickElement = document.getElementById('inventory-quick');
    const inventoryGridElement = document.getElementById('inventory-grid');
    const healthFillElement = document.getElementById('health-fill');
    const deathOverlay = document.getElementById('death-overlay');
    const respawnButton = document.getElementById('respawn-button');
    const hungerFillElement = document.getElementById('hunger-fill');
    const thirstFillElement = document.getElementById('thirst-fill');
    const actionButton = document.getElementById('action-button');
    const messageLog = document.getElementById('message-log');
    const MESSAGE_LIFETIME = 2600;
    const MESSAGE_LIMIT = 4;
    function showFloatingNumber(value, kind, targetElement = player) {
      if (!targetElement || !targetElement.isConnected) return;
      const gameRect = game.getBoundingClientRect();
      const targetRect = targetElement.getBoundingClientRect();
      if (!targetRect.width || !targetRect.height) return;
      const number = document.createElement('div');
      number.className = `floating-effect-number ${kind === 'negative' ? 'negative' : 'positive'}`;
      number.textContent = `${value > 0 ? '+' : ''}${value}`;
      number.style.left = `${targetRect.left - gameRect.left + targetRect.width / 2}px`;
      number.style.top = `${targetRect.top - gameRect.top + Math.min(18, targetRect.height * 0.2)}px`;
      game.appendChild(number);
      number.addEventListener('animationend', () => number.remove(), { once: true });
    }

    const HIT_EFFECT_SPRITES = {
      right: 'assets/hit_1.png',
      left: 'assets/hit_2.png',
      up: 'assets/hit_3.png',
      down: 'assets/hit_4.png'
    };

    function showHitEffect(attackerElement, direction) {
      if (!attackerElement || !attackerElement.isConnected) return;
      const gameRect = game.getBoundingClientRect();
      const attackerRect = attackerElement.getBoundingClientRect();
      if (!attackerRect.width || !attackerRect.height) return;
      const effect = document.createElement('img');
      effect.className = 'hit-effect-sprite';
      effect.src = HIT_EFFECT_SPRITES[direction] || HIT_EFFECT_SPRITES.down;
      effect.alt = '';
      effect.draggable = false;
      effect.style.left = `${attackerRect.left - gameRect.left + attackerRect.width / 2}px`;
      effect.style.top = `${attackerRect.top - gameRect.top + attackerRect.height / 2}px`;
      effect.onerror = () => {
        console.error(`Не удалось загрузить спрайт удара: ${effect.src}`);
        effect.remove();
      };
      game.appendChild(effect);
      effect.addEventListener('animationend', () => effect.remove(), { once: true });
    }

    function showGameMessage(text, type) {
      const message = document.createElement('div');
      message.className = `game-message ${type}`;
      message.textContent = text;
      messageLog.prepend(message);
      while (messageLog.children.length > MESSAGE_LIMIT) messageLog.lastElementChild.remove();
      window.setTimeout(() => message.remove(), MESSAGE_LIFETIME);
    }

    const craftOverlay = document.getElementById('craft-overlay');
    const craftRecipesElement = document.getElementById('craft-recipes');
    const craftTitleElement = document.querySelector('#craft-header strong');
    const SIMPLE_CRAFT_RECIPES = [
      { id: 'stone_pickaxe', name: 'Каменная кирка', ingredients: { wood: 1, stone: 1 } },
      { id: 'stone_axe', name: 'Каменный топор', ingredients: { wood: 1, stone: 1 } },
      { id: 'workbench', name: 'Верстак', ingredients: { wood: 5 } }
    ];
    const WORKBENCH_RECIPES = [
      { id: 'cloth', name: 'Ткань', ingredients: { wool: 3 } }
    ];
    const WORKSHOP_RECIPES = [
      { id: 'furnace', name: 'Горн', ingredients: { stone: 6, wood: 2, coal: 2 } },
      { id: 'anvil', name: 'Наковальня', ingredients: { iron_ingot: 4 } }
    ];

    function getResourceCount(resourceId) {
      return inventoryItems.find(item => item.id === resourceId)?.count || 0;
    }

    function craftItem(recipe) {
      const enough = Object.entries(recipe.ingredients).every(([id, amount]) => getResourceCount(id) >= amount);
      if (!enough) {
        showGameMessage('Недостаточно ингредиентов предметов для создания', 'damage');
        return;
      }

      if (TOOL_DEFINITIONS[recipe.id] && inventoryItems.length >= 16) {
        showGameMessage('Инвентарь заполнен', 'damage');
        return;
      }

      // Крафт гарантированный: ресурсы списываются только когда хватает всех ингредиентов.
      Object.entries(recipe.ingredients).forEach(([id, amount]) => {
        const stack = inventoryItems.find(item => item.id === id);
        stack.count -= amount;
      });
      for (let i = inventoryItems.length - 1; i >= 0; i--) {
        if (inventoryItems[i].count <= 0) inventoryItems.splice(i, 1);
      }
      const craftedItem = TOOL_DEFINITIONS[recipe.id] || WEAPON_DEFINITIONS[recipe.id] || BUILDING_DEFINITIONS[recipe.id] || (RESOURCE_NAMES[recipe.id] ? { id: recipe.id, name: RESOURCE_NAMES[recipe.id], icon: RESOURCE_ICONS[recipe.id] } : null);
      if (!craftedItem) {
        showGameMessage('Ошибка: предмет не найден в базе крафта', 'damage');
        renderInventory();
        return;
      }
      if (TOOL_DEFINITIONS[recipe.id]) {
        inventoryItems.push({ ...craftedItem, count: 1, durability: 100, maxDurability: 100 });
      } else if (WEAPON_DEFINITIONS[recipe.id]) {
        inventoryItems.push({ ...craftedItem, count: 1, durability: 100, maxDurability: 100 });
      } else {
        const overflow = addStackableItem(craftedItem, 1);
        if (overflow) {
          showGameMessage('Нет свободного слота для готового предмета', 'damage');
          renderInventory();
          return;
        }
      }
      renderInventory();
      showGameMessage(`${recipe.name} создан`, 'resource');
      markSaveDirty();
    }

    function renderCraftRecipes() {
      craftRecipesElement.replaceChildren();

      function addSection(titleText, recipes) {
        const heading = document.createElement('h3');
        heading.className = 'craft-section-title';
        heading.textContent = titleText;
        craftRecipesElement.appendChild(heading);

        recipes.forEach(recipe => {
          const card = document.createElement('div');
          card.className = 'craft-recipe';
          const title = document.createElement('div');
          title.className = 'craft-recipe-title';
          title.textContent = recipe.name;

          const recipeItem = TOOL_DEFINITIONS[recipe.id] || WEAPON_DEFINITIONS[recipe.id] || BUILDING_DEFINITIONS[recipe.id] || (RESOURCE_NAMES[recipe.id] ? { icon: RESOURCE_ICONS[recipe.id] } : null);
          if (recipeItem?.icon) {
            const recipeIcon = document.createElement('img');
            recipeIcon.src = recipeItem.icon;
            recipeIcon.alt = recipe.name;
            recipeIcon.style.cssText = 'width:42px;height:42px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:10px;';
            title.prepend(recipeIcon);
          }
          card.appendChild(title);

          if (recipe.unavailable) {
            const note = document.createElement('div');
            note.className = 'craft-recipe-title';
            note.textContent = 'Рецепт и материалы будут добавлены на следующем этапе.';
            card.appendChild(note);
            craftRecipesElement.appendChild(card);
            return;
          }

          const body = document.createElement('div');
          body.className = 'craft-recipe-body';
          Object.entries(recipe.ingredients).forEach(([id, amount], index) => {
            if (index) {
              const plus = document.createElement('span');
              plus.className = 'craft-plus';
              plus.textContent = '+';
              body.appendChild(plus);
            }
            const ingredient = document.createElement('div');
            ingredient.className = 'craft-ingredient';
            if (RESOURCE_ICONS[id]) {
              const image = document.createElement('img');
              image.src = RESOURCE_ICONS[id];
              image.alt = RESOURCE_NAMES[id] || id;
              ingredient.appendChild(image);
            }
            const quantity = document.createElement('span');
            quantity.textContent = `${RESOURCE_NAMES[id] || (id === 'wool' ? 'Шерсть' : id)} x${amount}`;
            ingredient.appendChild(quantity);
            body.appendChild(ingredient);
          });


          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'craft-create';
          button.textContent = '🔨 СОЗДАТЬ';
          button.addEventListener('click', () => craftItem(recipe));
          body.appendChild(button);
          card.appendChild(body);
          craftRecipesElement.appendChild(card);
        });
      }

      addSection('ПРОСТОЙ КРАФТ', SIMPLE_CRAFT_RECIPES);
      addSection('РЕЦЕПТЫ ВЕРСТАКА', WORKBENCH_RECIPES);
      addSection('МАСТЕРСКИЕ ОБЪЕКТЫ', WORKSHOP_RECIPES);
    }

    function renderInitialCraftRecipes() {
      craftRecipesElement.replaceChildren();
      const heading = document.createElement('h3');
      heading.className = 'craft-section-title';
      heading.textContent = 'НАЧАЛЬНЫЙ КРАФТ';
      craftRecipesElement.appendChild(heading);
      const initialRecipes = SIMPLE_CRAFT_RECIPES;
      initialRecipes.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'craft-recipe';
        const title = document.createElement('div');
        title.className = 'craft-recipe-title';
        title.textContent = recipe.name;
        const recipeItem = TOOL_DEFINITIONS[recipe.id] || WEAPON_DEFINITIONS[recipe.id] || BUILDING_DEFINITIONS[recipe.id];
        if (recipeItem?.icon) {
          const icon = document.createElement('img');
          icon.src = recipeItem.icon;
          icon.alt = recipe.name;
          icon.style.cssText = 'width:42px;height:42px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:10px;';
          title.prepend(icon);
        }
        card.appendChild(title);
        const body = document.createElement('div');
        body.className = 'craft-recipe-body';
        Object.entries(recipe.ingredients).forEach(([id, amount], index) => {
          if (index) {
            const plus = document.createElement('span');
            plus.className = 'craft-plus';
            plus.textContent = '+';
            body.appendChild(plus);
          }
          const ingredient = document.createElement('div');
          ingredient.className = 'craft-ingredient';
          const image = document.createElement('img');
          image.src = RESOURCE_ICONS[id];
          image.alt = RESOURCE_NAMES[id];
          ingredient.appendChild(image);
          const quantity = document.createElement('span');
          quantity.textContent = `x${amount}`;
          ingredient.appendChild(quantity);
          body.appendChild(ingredient);
        });
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'craft-create';
        button.textContent = '🔨 СОЗДАТЬ';
        button.addEventListener('click', () => craftItem(recipe));
        body.appendChild(button);
        card.appendChild(body);
        craftRecipesElement.appendChild(card);
      });
    }

    document.getElementById('craft-open').addEventListener('click', () => {
      craftTitleElement.textContent = 'Начальный крафт';
      renderInitialCraftRecipes();
      craftOverlay.classList.add('open');
    });
    document.getElementById('craft-close').addEventListener('click', () => craftOverlay.classList.remove('open'));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') craftOverlay.classList.remove('open');
    });
    craftOverlay.addEventListener('click', event => {
      if (event.target === craftOverlay) craftOverlay.classList.remove('open');
    });

    // Меню разработчика: выдаёт только предметы, уже описанные в игровых базах.
    const devOverlay = document.getElementById('dev-overlay');
    const devCategoriesElement = document.getElementById('dev-categories');
    const devItemsElement = document.getElementById('dev-items');
    const DEV_CATEGORIES = [
      { id: 'resources', title: 'РЕСУРСЫ' },
      { id: 'tools', title: 'ИНСТРУМЕНТЫ' },
      { id: 'weapons', title: 'ОРУЖИЕ' },
      { id: 'buildings', title: 'ПОСТРОЙКИ' }
    ];
    let activeDevCategory = 'resources';

    function getDevItems(categoryId) {
      if (categoryId === 'resources') {
        return Object.keys(RESOURCE_NAMES).filter(id => id !== 'dagger').map(id => ({
          id, name: RESOURCE_NAMES[id], icon: RESOURCE_ICONS[id], category: 'resource'
        }));
      }
      if (categoryId === 'tools') {
        return Object.values(TOOL_DEFINITIONS).map(item => ({ ...item, category: 'tool' }));
      }
      if (categoryId === 'weapons') {
        return Object.values(WEAPON_DEFINITIONS).map(item => ({ ...item, category: 'weapon' }));
      }
      if (categoryId === 'buildings') {
        return Object.values(BUILDING_DEFINITIONS).map(item => ({ ...item, category: 'building' }));
      }
      return [];
    }

    // Ресурсы и постройки складываются стопками максимум по 50 единиц.
    function addStackableItem(item, amount = 1) {
      let remaining = amount;
      const stacks = inventoryItems.filter(entry => entry.id === item.id);
      for (const stack of stacks) {
        const room = MAX_STACK_SIZE - stack.count;
        if (room <= 0) continue;
        const added = Math.min(room, remaining);
        stack.count += added;
        remaining -= added;
        if (remaining <= 0) break;
      }
      while (remaining > 0 && inventoryItems.length < 16) {
        const added = Math.min(MAX_STACK_SIZE, remaining);
        inventoryItems.push({ id: item.id, name: item.name, icon: item.icon, count: added, ...(item.type ? { type: item.type } : {}) });
        remaining -= added;
      }
      return remaining;
    }

    function addDeveloperItem(item) {
      const isTool = item.category === 'tool';
      const isWeapon = item.category === 'weapon';
      if (isTool || isWeapon) {
        if (inventoryItems.length >= 16) {
          showGameMessage('Инвентарь заполнен', 'damage');
          return;
        }
        inventoryItems.push({ ...item, count: 1, ...((isTool || isWeapon) ? { durability: 100, maxDurability: 100 } : {}) });
      } else {
        const overflow = addStackableItem(item, 1);
        if (overflow) {
          showGameMessage('Нет свободного слота в инвентаре', 'damage');
          return;
        }
      }

      renderInventory();
      markSaveDirty();

    function updateHunger(dt) {
      if (!activeWorldId || dt <= 0) return;
      hungerElapsed += dt;
      while (hungerElapsed >= HUNGER_TICK_SECONDS && hunger > 0) {
        hungerElapsed -= HUNGER_TICK_SECONDS;
        hunger = Math.max(0, hunger - HUNGER_LOSS);
        updateStatusBars();
        markSaveDirty();
      }
      if (hunger <= 0) {
        if (!starvationMessageShown) {
          starvationMessageShown = true;
          showGameMessage('Вы голодны', 'damage');
        }
        starvationDamageElapsed += dt;
        while (starvationDamageElapsed >= STARVATION_DAMAGE_INTERVAL) {
          starvationDamageElapsed -= STARVATION_DAMAGE_INTERVAL;
          applyDamage(STARVATION_DAMAGE, `Голод: получено ${STARVATION_DAMAGE} урона.`);
        }
      }
    }
