<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rock Land — прототип</title>
  <style>
    :root {
      --cell-size: 64px;
      --pad-size: 54px;
      --pad-gap: 5px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #26362d; font-family: Arial, sans-serif; touch-action: none;
    }
    #game { position: fixed; inset: 0; overflow: hidden; background: #26362d; }

    #terrain-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center;
    }
    .cell {
      width: var(--cell-size); height: var(--cell-size);
      background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
      image-rendering: pixelated;
    }

    #objects-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center; pointer-events: none;
    }
    .object-cell {
      position: relative; width: var(--cell-size); height: var(--cell-size);
      pointer-events: none;
    }
    .world-object {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      image-rendering: pixelated; object-fit: contain; max-width: none;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }
    .world-object.tree-1 { width: 64px; height: 128px; }
    .world-object.tree-2 { width: 128px; height: 64px; }
    .world-object.rock { width: 64px; height: 64px; }

    #actors-layer { position: absolute; inset: 0; pointer-events: none; }
    #player {
      position: absolute; left: 0; top: 0; width: 64px; height: 64px;
      transform: translate(-50%, -50%); image-rendering: pixelated;
      object-fit: contain; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .28));
      will-change: contents;
    }

    #controls {
      position: absolute; z-index: 5;
      left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, var(--pad-size));
      grid-template-rows: repeat(2, var(--pad-size)); gap: var(--pad-gap);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .direction {
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #d4d4d4; border-radius: 5px;
      background: rgba(210, 210, 210, .88); color: #424242;
      font-size: 26px; line-height: 1; box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
      cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .direction:active { background: #f0f0f0; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    /* Схематичный интерфейс: быстрые слоты, инвентарь и действие. */
    #quick-slots {
      position: absolute; z-index: 7; left: max(12px, env(safe-area-inset-left));
      top: 50%; transform: translateY(-50%); display: grid; gap: 5px;
    }
    .item-slot {
      width: 48px; height: 48px; border: 2px solid #aaa; border-radius: 4px;
      background: rgba(125,125,125,.88); color: #fff; display: flex;
      align-items: center; justify-content: center; position: relative;
      font: 12px Arial,sans-serif; text-shadow: 0 1px 2px #222;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .item-slot.selected { border: 3px solid #f2d45c; background: rgba(155,155,155,.96); }
    .slot-number { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #eee; }
    .slot-count { position: absolute; right: 3px; bottom: 2px; font-size: 11px; }
    .item-icon { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    #inventory-grid .item-icon { width: 34px; height: 34px; }
    #inventory-open {
      position: absolute; z-index: 7; top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 25px; cursor: pointer;
    }
    #action-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #action-feedback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 28px; }
    #action-button.hit #action-feedback { display: flex; }
    #action-button.hit #action-label { display: none; }
    #health-panel {
      position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%); color: white; font: 13px Arial,sans-serif;
      background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 4px; white-space: nowrap;
    }
    #inventory-overlay {
      display: none; position: absolute; z-index: 20; inset: 0; background: rgba(0,0,0,.55);
      align-items: center; justify-content: center; padding: 16px;
    }
    #inventory-overlay.open { display: flex; }
    #inventory-window {
      width: min(390px, 100%); max-height: min(560px, 92%); overflow: auto;
      background: #777; border: 2px solid #aaa; border-radius: 6px; padding: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45); color: white;
    }
    #inventory-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #inventory-header strong { font-size: 18px; }
    #inventory-close { width: 32px; height: 32px; border: 1px solid #ccc; border-radius: 4px; background: #999; font-size: 20px; }
    #inventory-quick, #inventory-grid { display: grid; grid-template-columns: repeat(4, 48px); gap: 7px; justify-content: center; }
    #inventory-quick { margin-bottom: 14px; }
    #inventory-grid { grid-template-columns: repeat(4, minmax(48px, 1fr)); }
    #inventory-grid .item-slot { width: 100%; max-width: 64px; height: 52px; justify-self: center; }
    @media (max-width: 480px) {
      :root { --pad-size: 48px; --pad-gap: 4px; }
      .item-slot { width: 42px; height: 42px; }
      #quick-slots { gap: 4px; }
      #inventory-quick { grid-template-columns: repeat(4, 42px); }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Игровой мир">
    <div id="terrain-layer" aria-hidden="true"></div>
    <div id="objects-layer" aria-hidden="true"></div>
    <div id="actors-layer" aria-hidden="true">
      <img id="player" src="assets/player/GG_5.png" alt="" draggable="false">
    </div>
    <div id="controls" aria-label="Управление движением">
      <button class="direction" id="up" aria-label="Вверх" type="button">↑</button>
      <button class="direction" id="left" aria-label="Влево" type="button">←</button>
      <button class="direction" id="down" aria-label="Вниз" type="button">↓</button>
      <button class="direction" id="right" aria-label="Вправо" type="button">→</button>
    </div>
    <div id="quick-slots" aria-label="Быстрые слоты"></div>
    <div id="health-panel">Здоровье: <span id="health-value">100</span>/100</div>
    <button id="inventory-open" type="button" aria-label="Открыть инвентарь">▦</button>
    <button id="action-button" type="button" aria-label="Ударить">
      <span id="action-label">✊</span><span id="action-feedback">💢</span>
    </button>
    <div id="inventory-overlay" role="dialog" aria-modal="true" aria-label="Инвентарь">
      <section id="inventory-window">
        <div id="inventory-header"><strong>Инвентарь</strong><button id="inventory-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="inventory-quick" aria-label="Быстрые слоты в инвентаре"></div>
        <div id="inventory-grid" aria-label="32 ячейки инвентаря"></div>
      </section>
    </div>
  </main>

  <script>
    const terrainLayer = document.getElementById('terrain-layer');
    const objectsLayer = document.getElementById('objects-layer');
    const player = document.getElementById('player');
    // Игрок находится в общем слое объектов для динамической сортировки по глубине.
    objectsLayer.appendChild(player);

    // Инвентарь: быстрые слоты и 32 ячейки используют одни и те же предметы.
    const quickSlots = [null, null, null, null];
    const inventoryItems = [];
    let selectedQuickSlot = 0;
    let health = 100;
    const MAX_HEALTH = 100;
    const RESOURCE_NAMES = { wood: 'Древесина', stone: 'Камень' };
    const RESOURCE_ICONS = { wood: 'assets/wood_1.png', stone: 'assets/stone_1.png' };
    // Поддержка будущих инструментов: прочности нет, инструмент не изнашивается.
    const TOOL_DEFINITIONS = {
      stone_axe: { name: 'Каменный топор', toolFor: 'tree', tier: 1, yield: 1, icon: '🪓' },
      stone_pickaxe: { name: 'Каменная кирка', toolFor: 'rock', tier: 1, yield: 1, icon: '⛏️' },
      iron_axe: { name: 'Железный топор', toolFor: 'tree', tier: 2, yield: 2, icon: '🪓' },
      iron_pickaxe: { name: 'Железная кирка', toolFor: 'rock', tier: 2, yield: 2, icon: '⛏️' }
    };
    const inventoryOverlay = document.getElementById('inventory-overlay');
    const quickSlotsElement = document.getElementById('quick-slots');
    const inventoryQuickElement = document.getElementById('inventory-quick');
    const inventoryGridElement = document.getElementById('inventory-grid');
    const healthValueElement = document.getElementById('health-value');
    const actionButton = document.getElementById('action-button');

    function addResource(resourceId, amount = 1) {
      let stack = inventoryItems.find(item => item.id === resourceId);
      if (!stack) {
        stack = { id: resourceId, name: RESOURCE_NAMES[resourceId], count: 0, icon: RESOURCE_ICONS[resourceId] };
        inventoryItems.push(stack);
      }
      stack.count += amount;
      renderInventory();
    }

    function makeSlot(index, item, isQuick = false) {
      const slot = document.createElement('button');
      slot.type = 'button';
      slot.className = 'item-slot' + (isQuick && index === selectedQuickSlot ? ' selected' : '');
      slot.title = item ? `${item.name}: ${item.count}` : `Пустой слот ${index + 1}`;
      if (isQuick) {
        const number = document.createElement('span');
        number.className = 'slot-number'; number.textContent = String(index + 1); slot.appendChild(number);
      }
      if (item) {
        const icon = document.createElement('img');
        icon.className = 'item-icon'; icon.src = item.icon; icon.alt = item.name;
        icon.onerror = () => { icon.style.display = 'none'; };
        slot.appendChild(icon);
      }
      if (item) {
        const count = document.createElement('span'); count.className = 'slot-count'; count.textContent = String(item.count); slot.appendChild(count);
      }
      if (isQuick) {
        slot.addEventListener('click', () => { selectedQuickSlot = index; renderInventory(); });
      } else if (item) {
        slot.addEventListener('click', () => { quickSlots[selectedQuickSlot] = item; renderInventory(); });
      }
      return slot;
    }

    function renderInventory() {
      quickSlotsElement.replaceChildren();
      inventoryQuickElement.replaceChildren();
      quickSlots.forEach((item, index) => {
        quickSlotsElement.appendChild(makeSlot(index, item, true));
        inventoryQuickElement.appendChild(makeSlot(index, item, true));
      });
      inventoryGridElement.replaceChildren();
      for (let i = 0; i < 32; i++) {
        inventoryGridElement.appendChild(makeSlot(i, inventoryItems[i] || null, false));
      }
      healthValueElement.textContent = String(health);
    }

    document.getElementById('inventory-open').addEventListener('click', () => inventoryOverlay.classList.add('open'));
    document.getElementById('inventory-close').addEventListener('click', () => inventoryOverlay.classList.remove('open'));
    inventoryOverlay.addEventListener('click', event => { if (event.target === inventoryOverlay) inventoryOverlay.classList.remove('open'); });

    // Текстуры земли: bg_1 — земля, bg_2 — трава, bg_3 — каменистая почва.
    const TILE_TEXTURES = {
      1: 'assets/bg_1.png',
      2: 'assets/bg_2.png',
      3: 'assets/bg_3.png'
    };

    // Отдельная таблица объектов синхронизирована с таблицей ландшафта.
    const OBJECT_SPRITES = {
      tree1: 'assets/tree_1.png',
      tree2: 'assets/tree_2.png',
      rock1: 'assets/rock_1.png',
      rock2: 'assets/rock_2.png'
    };
    let worldMap = [];
    let objectMap = [];
    let objectHitProgress = [];
    let objectHitRequired = [];
    let objectElements = [];
    let worldColumns = 0;
    let worldRows = 0;
    let worldPixelWidth = 0;
    let worldPixelHeight = 0;
    const PLAYER_COLLISION_SIZE = 40;

    // Имена спрайтов: 1–2 вверх, 3–4 вправо, 5–6 вниз, 7–8 влево.
    const PLAYER_SPRITES = {
      up:    ['assets/player/GG_1.png', 'assets/player/GG_2.png'],
      right: ['assets/player/GG_3.png', 'assets/player/GG_4.png'],
      down:  ['assets/player/GG_5.png', 'assets/player/GG_6.png'],
      left:  ['assets/player/GG_7.png', 'assets/player/GG_8.png']
    };

    let worldX = 0;
    let worldY = 0;
    let velocityX = 0;
    let velocityY = 0;

    // Настройки движения и инерции.
    const ACCELERATION = 900; // разгон, px/s²
    const MAX_SPEED = 190;   // максимальная скорость, px/s
    const FRICTION = 5.5;    // торможение после отпускания
    const TURN_DRAG = 1.7;  // мягкое гашение скорости при развороте

    const pressed = new Set();
    const keyDirections = {
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down',
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right'
    };

    let facing = 'down';
    let animationTimer = 0;
    let animationFrame = 0;
    const WALK_FRAME_DURATION = 0.18;
    const WALK_THRESHOLD = 10;
    let currentSprite = '';

    function setPlayerSprite(direction, frame = 0) {
      const src = PLAYER_SPRITES[direction][frame];
      if (src !== currentSprite) {
        player.src = src;
        currentSprite = src;
      }
    }

    // Базовые веса типов местности: 1 — почва, 2 — трава, 3 — каменистая земля.
    // Ландшафт генерируется блоками 2×2 клетки (четыре клетки одного типа).
    // Переходы: трава ↔ почва ↔ камни. Трава и камни напрямую не соприкасаются сторонами.
    const TILE_WEIGHTS = { 1: 30, 2: 10, 3: 60 };
    const BLOCK_SIZE = 2;

    function canNeighbor(tile, neighbor) {
      if (neighbor == null) return true;
      // Трава (2) не соприкасается с камнями (3); почва (1) — переходный тип.
      return !((tile === 2 && neighbor === 3) || (tile === 3 && neighbor === 2));
    }

    function chooseWeightedBlock(leftTile, upperTile) {
      const allowed = [1, 2, 3].filter((tile) =>
        canNeighbor(tile, leftTile) && canNeighbor(tile, upperTile)
      );
      const totalWeight = allowed.reduce((sum, tile) => sum + TILE_WEIGHTS[tile], 0);
      let roll = Math.random() * totalWeight;
      for (const tile of allowed) {
        roll -= TILE_WEIGHTS[tile];
        if (roll < 0) return tile;
      }
      return allowed[allowed.length - 1] ?? 1;
    }

    function generateWorld() {
      const cellSize = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--cell-size')) || 64;
      const columns = Math.max(41, (Math.ceil(window.innerWidth * 3 / cellSize) | 1));
      const rows = Math.max(41, (Math.ceil(window.innerHeight * 3 / cellSize) | 1));
      const terrainFragment = document.createDocumentFragment();
      const objectFragment = document.createDocumentFragment();
      const blockColumns = Math.ceil(columns / BLOCK_SIZE);
      const blockRows = Math.ceil(rows / BLOCK_SIZE);
      const blockMap = Array.from({ length: blockRows }, () => Array(blockColumns).fill(0));
      worldMap = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectMap = Array.from({ length: rows }, () => Array(columns).fill(null));
      objectHitProgress = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectHitRequired = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectElements = Array.from({ length: rows }, () => Array(columns).fill(null));
      worldColumns = columns;
      worldRows = rows;
      worldPixelWidth = columns * cellSize;
      worldPixelHeight = rows * cellSize;

      // Сначала генерируем ландшафт блоками 2×2.
      for (let blockRow = 0; blockRow < blockRows; blockRow++) {
        for (let blockCol = 0; blockCol < blockColumns; blockCol++) {
          const leftTile = blockCol > 0 ? blockMap[blockRow][blockCol - 1] : null;
          const upperTile = blockRow > 0 ? blockMap[blockRow - 1][blockCol] : null;
          const tileId = chooseWeightedBlock(leftTile, upperTile);
          blockMap[blockRow][blockCol] = tileId;
          for (let dy = 0; dy < BLOCK_SIZE; dy++) {
            for (let dx = 0; dx < BLOCK_SIZE; dx++) {
              const row = blockRow * BLOCK_SIZE + dy;
              const col = blockCol * BLOCK_SIZE + dx;
              if (row < rows && col < columns) worldMap[row][col] = tileId;
            }
          }
        }
      }

      // Затем создаём отдельную таблицу объектов по значениям таблицы ландшафта.
      // Трава: дерево в каждой клетке. Каменистая земля: камень с вероятностью 20%.
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const tileId = worldMap[row][col];
          const terrainCell = document.createElement('div');
          terrainCell.className = 'cell';
          terrainCell.dataset.tile = String(tileId);
          terrainCell.style.backgroundImage = `url("${TILE_TEXTURES[tileId]}")`;
          terrainFragment.appendChild(terrainCell);

          let objectType = null;
          if (tileId === 2) {
            objectType = Math.random() < 0.5 ? 'tree1' : 'tree2';
          } else if (tileId === 3 && Math.random() < 0.20) {
            objectType = Math.random() < 0.5 ? 'rock1' : 'rock2';
          }
          objectMap[row][col] = objectType;
          if (objectType === 'tree1' || objectType === 'tree2') {
            objectHitRequired[row][col] = 2 + Math.floor(Math.random() * 5); // 2–6 ударов
          } else if (objectType === 'rock1' || objectType === 'rock2') {
            objectHitRequired[row][col] = 3; // Камень всегда требует 3 удара
          }

          const objectCell = document.createElement('div');
          objectCell.className = 'object-cell';
          objectCell.dataset.row = String(row);
          objectCell.dataset.col = String(col);
          // Нижние строки рисуются поверх верхних: это основа Y-сортировки.
          objectCell.style.zIndex = String((row + 1) * 64);
          if (objectType) {
            const sprite = document.createElement('img');
            sprite.className = `world-object ${objectType === 'tree1' ? 'tree-1' : objectType === 'tree2' ? 'tree-2' : 'rock'}`;
            sprite.src = OBJECT_SPRITES[objectType];
            sprite.alt = '';
            sprite.draggable = false;
            sprite.onerror = () => console.error(`Не удалось загрузить спрайт объекта: ${sprite.src}`);
            objectCell.appendChild(sprite);
          }
          objectElements[row][col] = objectCell;
          objectFragment.appendChild(objectCell);
        }
      }

      terrainLayer.replaceChildren(terrainFragment);
      objectsLayer.replaceChildren(objectFragment);
      // replaceChildren очищает слой, поэтому возвращаем игрока после генерации клеток.
      objectsLayer.appendChild(player);
      for (const layer of [terrainLayer, objectsLayer]) {
        layer.style.gridTemplateColumns = `repeat(${columns}, var(--cell-size))`;
        layer.style.gridTemplateRows = `repeat(${rows}, var(--cell-size))`;
        layer.style.width = `${worldPixelWidth}px`;
        layer.style.height = `${worldPixelHeight}px`;
      }

      // Ищем ближайшую свободную клетку для начального появления игрока.
      const centerRow = Math.floor(rows / 2);
      const centerCol = Math.floor(columns / 2);
      let spawn = null;
      for (let radius = 0; radius < Math.max(rows, columns) && !spawn; radius++) {
        for (let row = Math.max(0, centerRow - radius); row <= Math.min(rows - 1, centerRow + radius) && !spawn; row++) {
          for (let col = Math.max(0, centerCol - radius); col <= Math.min(columns - 1, centerCol + radius); col++) {
            if (objectMap[row][col] === null) { spawn = { row, col }; break; }
          }
        }
      }
      if (spawn) {
        worldX = (spawn.col + 0.5) * cellSize - worldPixelWidth / 2;
        worldY = (spawn.row + 0.5) * cellSize - worldPixelHeight / 2;
      } else {
        worldX = 0;
        worldY = 0;
      }
      velocityX = 0;
      velocityY = 0;
      updateCamera();
    }

    function updateCamera() {
      const transform = `translate(calc(-50% - ${worldX}px), calc(-50% - ${worldY}px))`;
      terrainLayer.style.transform = transform;
      objectsLayer.style.transform = transform;

      // Игрок находится в координатах мира внутри objectsLayer.
      // Камера сдвигает весь слой, поэтому игрок остаётся в центре экрана.
      const playerWorldX = worldPixelWidth / 2 + worldX;
      const playerWorldY = worldPixelHeight / 2 + worldY;
      player.style.left = `${playerWorldX}px`;
      player.style.top = `${playerWorldY}px`;

      // Сравниваем точку ног игрока с основанием объектов по оси Y.
      const playerFeetY = playerWorldY + PLAYER_COLLISION_SIZE / 2;
      player.style.zIndex = String(Math.floor(playerFeetY) + 1);
    }

    // Коллизия занимает всю клетку 64×64, где есть дерево или камень.
    // Проверяем движение по осям отдельно, чтобы игрок не проскальзывал между объектами.
    function collidesAt(nextX, nextY) {
      const cellSize = 64;
      const half = PLAYER_COLLISION_SIZE / 2;
      const centerX = worldPixelWidth / 2 + nextX;
      const centerY = worldPixelHeight / 2 + nextY;
      const left = centerX - half;
      const right = centerX + half;
      const top = centerY - half;
      const bottom = centerY + half;
      const minCol = Math.floor(left / cellSize);
      const maxCol = Math.floor((right - 0.001) / cellSize);
      const minRow = Math.floor(top / cellSize);
      const maxRow = Math.floor((bottom - 0.001) / cellSize);
      for (let row = minRow; row <= maxRow; row++) {
        for (let col = minCol; col <= maxCol; col++) {
          if (row < 0 || col < 0 || row >= worldRows || col >= worldColumns) return true;
          if (objectMap[row]?.[col]) return true;
        }
      }
      return false;
    }

    const HIT_HEALTH_COST = 2;
    let hitFeedbackTimer = 0;
    function performHit() {
      const cellSize = 64;
      const centerX = worldPixelWidth / 2 + worldX;
      const centerY = worldPixelHeight / 2 + worldY;
      const offsets = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [dx, dy] = offsets[facing];
      const col = Math.floor(centerX / cellSize) + dx;
      const row = Math.floor(centerY / cellSize) + dy;
      const objectType = objectMap[row]?.[col];
      actionButton.classList.add('hit');
      hitFeedbackTimer = 0.18;

      if (objectType) {
        const targetKind = objectType.startsWith('tree') ? 'tree' : 'rock';
        const resourceId = targetKind === 'tree' ? 'wood' : 'stone';
        const selectedItem = quickSlots[selectedQuickSlot];
        const tool = selectedItem?.toolFor === targetKind ? selectedItem : null;

        // Каждый удар кулаком отнимает здоровье. Подходящий инструмент — нет.
        if (!tool) health = Math.max(0, health - HIT_HEALTH_COST);

        objectHitProgress[row][col] += 1;
        const required = objectHitRequired[row][col] || (targetKind === 'tree' ? 2 : 3);

        // Ресурс начисляется только после разрушения объекта.
        if (objectHitProgress[row][col] >= required) {
          addResource(resourceId, tool ? tool.yield : 1);
          objectMap[row][col] = null;
          objectHitProgress[row][col] = 0;
          objectHitRequired[row][col] = 0;
          const objectCell = objectElements[row]?.[col];
          if (objectCell) objectCell.replaceChildren();
        }
      }
      healthValueElement.textContent = String(health);
    }
    actionButton.addEventListener('click', performHit);
    window.addEventListener('keydown', event => {
      if (event.key >= '1' && event.key <= '4') {
        selectedQuickSlot = Number(event.key) - 1;
        renderInventory();
      }
      if (event.code === 'Space' && !event.repeat) { event.preventDefault(); performHit(); }
      if (event.key === 'Escape') inventoryOverlay.classList.remove('open');
    });

    function setDirection(direction, isDown) {
      if (isDown) pressed.add(direction);
      else pressed.delete(direction);
    }

    // Экранные стрелки поддерживают удержание мышью и пальцем.
    document.querySelectorAll('.direction').forEach((button) => {
      const direction = button.id;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture?.(event.pointerId);
        setDirection(direction, true);
      });
      const release = (event) => {
        event.preventDefault();
        setDirection(direction, false);
      };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', () => setDirection(direction, false));
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('keydown', (event) => {
      const direction = keyDirections[event.key];
      if (!direction) return;
      event.preventDefault();
      pressed.add(direction);
    });
    window.addEventListener('keyup', (event) => {
      const direction = keyDirections[event.key];
      if (!direction) return;
      event.preventDefault();
      pressed.delete(direction);
    });
    window.addEventListener('blur', () => pressed.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pressed.clear();
    });

    let previousTime = 0;
    function frame(time) {
      const dt = previousTime ? Math.min((time - previousTime) / 1000, 0.033) : 0;
      previousTime = time;

      let inputX = (pressed.has('right') ? 1 : 0) - (pressed.has('left') ? 1 : 0);
      let inputY = (pressed.has('down') ? 1 : 0) - (pressed.has('up') ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY);
      if (inputLength > 0) {
        inputX /= inputLength;
        inputY /= inputLength;

        // Направление взгляда следует за последним активным вводом.
        if (Math.abs(inputX) > Math.abs(inputY)) facing = inputX > 0 ? 'right' : 'left';
        else facing = inputY > 0 ? 'down' : 'up';

        const dot = velocityX * inputX + velocityY * inputY;
        if (dot < 0) {
          velocityX *= Math.exp(-TURN_DRAG * dt);
          velocityY *= Math.exp(-TURN_DRAG * dt);
        }
        velocityX += inputX * ACCELERATION * dt;
        velocityY += inputY * ACCELERATION * dt;
      } else {
        const damping = Math.exp(-FRICTION * dt);
        velocityX *= damping;
        velocityY *= damping;
      }

      const speed = Math.hypot(velocityX, velocityY);
      if (speed > MAX_SPEED) {
        velocityX = velocityX / speed * MAX_SPEED;
        velocityY = velocityY / speed * MAX_SPEED;
      }

      const nextX = worldX + velocityX * dt;
      const nextY = worldY + velocityY * dt;
      if (!collidesAt(nextX, worldY)) worldX = nextX;
      else velocityX = 0;
      if (!collidesAt(worldX, nextY)) worldY = nextY;
      else velocityY = 0;

      if (pressed.size === 0 && Math.hypot(velocityX, velocityY) < 2) {
        velocityX = 0;
        velocityY = 0;
      }

      const actualSpeed = Math.hypot(velocityX, velocityY);
      if (actualSpeed > WALK_THRESHOLD) {
        animationTimer += dt;
        if (animationTimer >= WALK_FRAME_DURATION) {
          animationTimer %= WALK_FRAME_DURATION;
          animationFrame = 1 - animationFrame;
        }
      } else {
        animationTimer = 0;
        animationFrame = 0;
      }

      setPlayerSprite(facing, actualSpeed > WALK_THRESHOLD ? animationFrame : 0);
      updateCamera();
      if (hitFeedbackTimer > 0) {
        hitFeedbackTimer -= dt;
        if (hitFeedbackTimer <= 0) actionButton.classList.remove('hit');
      }
      requestAnimationFrame(frame);
    }

    // Предзагружаем графику, чтобы смена кадров не мигала.
    [...Object.values(TILE_TEXTURES), ...Object.values(PLAYER_SPRITES).flat(), ...Object.values(OBJECT_SPRITES)].forEach((src) => {
      const image = new Image();
      image.onerror = () => console.error(`Не удалось загрузить изображение: ${src}`);
      image.src = src;
    });

    window.addEventListener('resize', generateWorld);
    setPlayerSprite('down', 0);
    renderInventory();
    generateWorld();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
