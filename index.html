<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rock Land — прототип</title>
  <style>
    @font-face {
      font-family: 'PressStart2P';
      src: url('assets/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --cell-size: 64px;
      --pad-size: 54px;
      --pad-gap: 5px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #26362d; font-family: 'PressStart2P', monospace; touch-action: none;
    }
    #game { position: fixed; inset: 0; overflow: hidden; background: #26362d; }

    #terrain-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center;
    }
    .cell {
      width: var(--cell-size); height: var(--cell-size);
      background-size: calc(100% + 1px) calc(100% + 1px); background-position: center; background-repeat: no-repeat;
      image-rendering: pixelated;
      /* Перекрываем субпиксельные щели между тайлами при движении камеры. */
    }

    #objects-layer {
      position: absolute; left: 50%; top: 50%; display: grid;
      align-content: start; justify-content: start; will-change: transform;
      transform-origin: center; pointer-events: none;
    }
    .object-cell {
      position: relative; width: var(--cell-size); height: var(--cell-size);
      pointer-events: none;
    }
    .world-object {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      image-rendering: pixelated; object-fit: contain; max-width: none;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }
    .world-object.tree-1 { width: 64px; height: 128px; }
    .world-object.tree-2 { width: 128px; height: 64px; }
    .world-object.rock { width: 64px; height: 64px; }
    .workbench-marker {
      position:absolute; left:50%; bottom:-8px;
      width:64px; height:64px;
      transform:translateX(-50%);
      object-fit:contain; image-rendering:pixelated;
      pointer-events:none; z-index:5;
    }
    /* Сдвиг компенсирует прозрачный отступ снизу в PNG: видимое основание касается нижнего края ячейки. */
    /* Верстак и наковальня уменьшены на 25%, основание выровнено по нижнему краю ячейки. */
    .workbench-marker.workbench,
    .workbench-marker.anvil {
      width:48px; height:48px;
    }
    #placement-preview { position:absolute; width:64px; height:64px; display:none; border:3px solid #e33; background:rgba(235,35,35,.28); box-shadow:inset 0 0 0 1px #fff8; pointer-events:none; z-index:100000; }
    #placement-preview.valid { border-color:#35e65b; background:rgba(35,220,75,.28); }

    #actors-layer { position: absolute; inset: 0; pointer-events: none; }
    #player {
      position: absolute; left: 0; top: 0; width: 64px; height: 64px;
      transform: translate(-50%, -50%); image-rendering: pixelated;
      object-fit: contain; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .28));
      will-change: contents;
    }

    #controls {
      position: absolute; z-index: 5;
      left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, var(--pad-size));
      grid-template-rows: repeat(2, var(--pad-size)); gap: var(--pad-gap);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .direction {
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #d4d4d4; border-radius: 5px;
      background: rgba(210, 210, 210, .88); color: #424242;
      font-size: 26px; line-height: 1; box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
      cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    .direction:active { background: #f0f0f0; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    /* Схематичный интерфейс: быстрые слоты, инвентарь и действие. */
    #world-controls { position:absolute; z-index:8; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); display:flex; gap:6px; }
    #world-controls button { border:1px solid #d4d4d4; border-radius:4px; padding:8px 9px; background:rgba(70,85,72,.94); color:#fff; font:7px/1.5 'PressStart2P',monospace; cursor:pointer; }
    #quick-slots {
      position: absolute; z-index: 7; left: max(12px, env(safe-area-inset-left));
      top: 50%; transform: translateY(-50%); display: grid; gap: 5px;
    }
    .item-slot {
      width: 48px; height: 48px; border: 2px solid #aaa; border-radius: 4px;
      background: rgba(125,125,125,.88); color: #fff; display: flex;
      align-items: center; justify-content: center; position: relative;
      font: 8px 'PressStart2P', monospace; text-shadow: 0 1px 2px #222;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .item-slot.selected { border: 3px solid #f2d45c; background: rgba(155,155,155,.96); }
    .slot-number { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #eee; }
    .slot-count { position: absolute; right: 3px; bottom: 2px; font-size: 11px; }
    .item-icon { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
    #inventory-grid .item-icon { width: 34px; height: 34px; }
    .durability-track { position:absolute; left:5px; right:5px; bottom:4px; height:5px; background:#292929; border:1px solid #111; border-radius:2px; overflow:hidden; }
    .durability-fill { display:block; height:100%; }
    .durability-value { position:absolute; left:0; right:0; bottom:10px; color:#fff; font:8px monospace; text-shadow:1px 1px #000; text-align:center; pointer-events:none; }
    #inventory-open {
      position: absolute; z-index: 7; top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 25px; cursor: pointer;
    }
    #craft-open {
      position: absolute; z-index: 7; top: calc(max(14px, env(safe-area-inset-top)) + var(--pad-size) + 8px);
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 23px; cursor: pointer;
    }
    #craft-open {
      position: absolute; z-index: 7; top: calc(max(14px, env(safe-area-inset-top)) + var(--pad-size) + 8px);
      right: max(14px, env(safe-area-inset-right)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(150,150,150,.9);
      color: #333; font-size: 23px; cursor: pointer;
    }
    #craft-overlay {
      display: none; position: absolute; z-index: 21; inset: 0; background: rgba(0,0,0,.62);
      align-items: center; justify-content: center; padding: 16px;
    }
    #craft-overlay.open { display: flex; }
    #craft-window {
      width: min(560px, 100%); max-height: 90%; overflow: auto; padding: 14px;
      background: #777; color: #fff; border: 2px solid #aaa; border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #craft-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    #craft-header strong { font-size: 10px; line-height: 1.8; }
    #craft-close { width:32px; height:32px; border:1px solid #ccc; border-radius:4px; background:#999; font-size:20px; }
    .craft-section-title {
      margin: 14px 0 9px; padding: 8px 10px; background: #555;
      border: 1px solid #aaa; color: #fff; font: 9px/1.8 'PressStart2P',monospace;
    }
    .craft-recipe {
      background: #929292; border: 2px solid #bcbcbc; border-radius: 4px;
      padding: 12px; margin-bottom: 10px; color: #fff;
    }
    .craft-recipe-title { font-size: 9px; line-height: 1.8; margin-bottom: 10px; }
    .craft-recipe-body { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .craft-ingredient {
      min-width: 64px; display:flex; flex-direction:column; align-items:center; gap:5px;
      padding:6px; background:rgba(40,40,40,.28); border:1px solid rgba(255,255,255,.2);
      font: 8px 'PressStart2P', monospace;
    }
    .craft-ingredient img { width:34px; height:34px; object-fit:contain; image-rendering:pixelated; }
    .craft-plus { font: 12px 'PressStart2P', monospace; }
    .craft-create {
      margin-left:auto; min-height:42px; padding:8px 12px; border:1px solid #555; border-radius:4px;
      background:#383838; color:#fff; font: 8px/1.7 'PressStart2P',monospace; cursor:pointer;
    }
    .craft-create:active { background:#222; transform:translateY(1px); }
    .craft-create img { width:22px; height:22px; object-fit:contain; vertical-align:middle; }
    @media (max-width:480px) {
      #craft-window { padding:10px; }
      .craft-recipe { padding:9px; }
      .craft-recipe-body { gap:6px; }
      .craft-create { width:100%; margin:4px 0 0; }
    }
    #action-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom)); width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #interact-button {
      position: absolute; z-index: 7; right: max(14px, env(safe-area-inset-right));
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + var(--pad-size) + 10px);
      width: var(--pad-size); height: var(--pad-size);
      border: 1px solid #d4d4d4; border-radius: 5px; background: rgba(190,190,190,.92);
      color: #333; font-size: 25px; cursor: pointer; user-select: none; touch-action: manipulation;
    }
    #action-feedback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 28px; }
    #action-button.hit #action-feedback { display: flex; }
    #action-button.hit #action-label { display: none; }
    #health-panel {
      position: absolute; z-index: 6; top: max(14px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%); color: white; font: 13px Arial,sans-serif;
      background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 4px; white-space: nowrap;
    }
    /* Fallout-подобная лента системных сообщений внизу экрана. */
    #message-log {
      /* Уведомления должны быть поверх окон инвентаря и крафта. */
      position: absolute; z-index: 30; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(620px, calc(100% - 150px));
      display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 7px;
      pointer-events: none;
    }
    .game-message {
      max-width: 100%; padding: 9px 12px; color: #eee;
      background: rgba(8, 10, 9, .86); border: 2px solid #777;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.7), 0 3px 8px rgba(0,0,0,.45);
      font: 9px/1.7 'PressStart2P', monospace; text-shadow: 1px 1px #000;
      overflow-wrap: anywhere; animation: message-in .12s ease-out;
    }
    .game-message.damage { color: #ff5555; border-color: #a43b3b; }
    .game-message.resource { color: #75e078; border-color: #438a49; }
    @keyframes message-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      #message-log { width: calc(100% - 120px); bottom: 90px; }
      .game-message { font-size: 7px; padding: 7px 8px; }
    }
    #inventory-overlay {
      display: none; position: absolute; z-index: 20; inset: 0; background: rgba(0,0,0,.55);
      align-items: center; justify-content: center; padding: 16px;
    }
    #inventory-overlay.open { display: flex; }
    #inventory-window {
      width: min(390px, 100%); max-height: min(560px, 92%); overflow: auto;
      background: #777; border: 2px solid #aaa; border-radius: 6px; padding: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.45); color: white;
    }
    #inventory-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #inventory-header strong { font-size: 18px; }
    #inventory-close { width: 32px; height: 32px; border: 1px solid #ccc; border-radius: 4px; background: #999; font-size: 20px; }
    #inventory-quick, #inventory-grid { display: grid; grid-template-columns: repeat(4, 48px); gap: 7px; justify-content: center; }
    #inventory-quick { margin-bottom: 14px; }
    #inventory-grid { grid-template-columns: repeat(4, minmax(48px, 1fr)); }
    #inventory-grid .item-slot { width: 100%; max-width: 64px; height: 52px; justify-self: center; }
    @media (max-width: 480px) {
      :root { --pad-size: 48px; --pad-gap: 4px; }
      .item-slot { width: 42px; height: 42px; }
      #quick-slots { gap: 4px; }
      #inventory-quick { grid-template-columns: repeat(4, 42px); }
    }

    #world-menu { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(20,31,25,.97); color:#fff; overflow:auto; }
    #world-menu[hidden] { display:none; }
    #world-menu-panel { width:min(620px,100%); max-height:94vh; overflow:auto; padding:18px; background:#4e5c50; border:3px solid #aab5a9; box-shadow:0 10px 35px #0009; }
    #world-menu h1 { margin:0 0 10px; text-align:center; font-size:clamp(16px,4vw,24px); }
    #world-menu-subtitle { text-align:center; color:#d6dfd4; font-size:9px; line-height:1.8; margin-bottom:18px; }
    .world-slot { padding:12px; margin:9px 0; border:2px solid #aab5a9; background:#667367; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .world-slot-info { min-width:0; flex:1; }
    .world-slot-name { font-size:10px; line-height:1.8; overflow-wrap:anywhere; }
    .world-slot-meta { color:#dce4dc; font:9px/1.8 Arial,sans-serif; margin-top:5px; }
    .world-slot-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .world-menu-button { border:1px solid #d6dfd4; border-radius:3px; padding:9px 10px; background:#303c32; color:white; font:8px/1.6 'PressStart2P',monospace; cursor:pointer; }
    .world-menu-button:disabled { opacity:.45; cursor:not-allowed; }
    .world-menu-button.danger { background:#713d39; }
    #world-menu-status { min-height:22px; margin-top:10px; color:#f3e6a2; font:9px/1.8 Arial,sans-serif; text-align:center; }
    #world-name-dialog { display:none; margin-top:14px; padding:12px; background:#39463b; border:1px solid #aab5a9; }
    #world-name-dialog.open { display:block; }
    #world-name-input { width:100%; padding:10px; margin:8px 0; font:12px Arial,sans-serif; }
  </style>
</head>
<body>

  <section id="world-menu" hidden aria-label="Выбор мира">
    <div id="world-menu-panel">
      <h1>ROCK LAND</h1>
      <div id="world-menu-subtitle">ВЫБЕРИ МИР ИЛИ СОЗДАЙ НОВЫЙ</div>
      <div id="world-slots"></div>
      <div id="world-menu-status" role="status"></div>
      <div id="world-name-dialog">
        <label for="world-name-input" style="font:9px/1.8 'PressStart2P',monospace">НАЗВАНИЕ НОВОГО МИРА</label>
        <input id="world-name-input" type="text" maxlength="32" placeholder="Мой мир">
        <button class="world-menu-button" id="world-create-confirm" type="button">СОЗДАТЬ</button>
        <button class="world-menu-button" id="world-create-cancel" type="button">ОТМЕНА</button>
      </div>
    </div>
  </section>
  <main id="game" aria-label="Игровой мир">
    <div id="terrain-layer" aria-hidden="true"></div>
    <div id="objects-layer" aria-hidden="true"></div>
    <div id="actors-layer" aria-hidden="true">
      <img id="player" src="assets/player/GG_5.png" alt="" draggable="false">
    </div>
    <div id="controls" aria-label="Управление движением">
      <button class="direction" id="up" aria-label="Вверх" type="button">↑</button>
      <button class="direction" id="left" aria-label="Влево" type="button">←</button>
      <button class="direction" id="down" aria-label="Вниз" type="button">↓</button>
      <button class="direction" id="right" aria-label="Вправо" type="button">→</button>
    </div>
    <div id="quick-slots" aria-label="Быстрые слоты"></div>
    <div id="world-controls">
      <button id="world-save-button" type="button">СОХРАНИТЬ</button>
      <button id="world-exit-button" type="button">В МИРЫ</button>
    </div>
    <div id="health-panel">Здоровье: <span id="health-value">100</span>/100</div>
    <button id="inventory-open" type="button" aria-label="Открыть инвентарь">▦</button>
    <button id="craft-open" type="button" aria-label="Открыть начальный крафт">🔨</button>
    <div id="message-log" aria-live="polite" aria-atomic="false"></div>
    <button id="interact-button" type="button" aria-label="Взаимодействовать с объектом">🖐️</button>
    <button id="action-button" type="button" aria-label="Ударить">
      <span id="action-label">✊</span><span id="action-feedback">💢</span>
    </button>
    <div id="inventory-overlay" role="dialog" aria-modal="true" aria-label="Инвентарь">
      <section id="inventory-window">
        <div id="inventory-header"><strong>Инвентарь</strong><button id="inventory-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="inventory-quick" aria-label="Быстрые слоты в инвентаре"></div>
        <div id="inventory-grid" aria-label="16 ячеек инвентаря"></div>
      </section>
    </div>
    <div id="craft-overlay" role="dialog" aria-modal="true" aria-label="Крафт">
      <section id="craft-window">
        <div id="craft-header"><strong>Верстак — меню крафта</strong><button id="craft-close" type="button" aria-label="Закрыть">×</button></div>
        <div id="craft-recipes"></div>
      </section>
    </div>
  </main>

  <script>
    const terrainLayer = document.getElementById('terrain-layer');
    const objectsLayer = document.getElementById('objects-layer');
    const player = document.getElementById('player');
    // Игрок находится в общем слое объектов для динамической сортировки по глубине.
    objectsLayer.appendChild(player);
    const placementPreview = document.createElement('div');
    placementPreview.id = 'placement-preview';
    objectsLayer.appendChild(placementPreview);

    // Инвентарь: быстрые слоты и 16 ячеек используют одни и те же предметы.
    const quickSlots = [null, null, null, null];
    const inventoryItems = [];
    let selectedQuickSlot = 0;
    let health = 100;
    const MAX_HEALTH = 100;
    let activeWorldId = null;
    let activeWorldName = '';
    let saveDatabase = null;
    let saveDirty = false;
    let saveInProgress = false;
    let lastSavedAt = 0;
    let autoSaveTimer = null;
    let saveDebounceTimer = null;
    const MAX_WORLDS = 5;
    const SAVE_INTERVAL_MS = 60000;
    const SAVE_DB_NAME = 'RockLandSaveDB';
    const SAVE_DB_VERSION = 1;
    const RESOURCE_NAMES = { wood: 'Древесина', stone: 'Камень', coal: 'Уголь', iron_ore: 'Железная руда', iron_ingot: 'Железный слиток', steel_ingot: 'Стальной слиток' };
    const RESOURCE_ICONS = { wood: 'assets/wood_1.png', stone: 'assets/stone_1.png', coal: 'assets/coal_1.png', iron_ore: 'assets/iron_ore_1.png', iron_ingot: 'assets/iron_ingot_1.png', steel_ingot: 'assets/steel_ingot_1.png' };
    // Инструменты и оружие имеют индивидуальную прочность: 100 единиц при создании.
    const TOOL_DEFINITIONS = {
      stone_axe: { id: 'stone_axe', name: 'Каменный топор', toolFor: 'tree', tier: 1, yield: 1, icon: 'assets/tools/axe_1.png' },
      iron_axe: { id: 'iron_axe', name: 'Железный топор', toolFor: 'tree', tier: 2, yield: 2, icon: 'assets/tools/axe_2.png' },
      steel_axe: { id: 'steel_axe', name: 'Стальной топор', toolFor: 'tree', tier: 3, yield: 3, icon: 'assets/tools/axe_3.png' },
      stone_pickaxe: { id: 'stone_pickaxe', name: 'Каменная кирка', toolFor: 'rock', tier: 1, yield: 1, icon: 'assets/tools/pickaxe_1.png' },
      iron_pickaxe: { id: 'iron_pickaxe', name: 'Железная кирка', toolFor: 'rock', tier: 2, yield: 2, icon: 'assets/tools/pickaxe_2.png' },
      steel_pickaxe: { id: 'steel_pickaxe', name: 'Стальная кирка', toolFor: 'rock', tier: 3, yield: 3, icon: 'assets/tools/pickaxe_3.png' }
    };
    const BUILDING_DEFINITIONS = {
      workbench: { id: 'workbench', name: 'Верстак', icon: 'assets/buildings/workbench_1.png', type: 'building' },
      furnace: { id: 'furnace', name: 'Горн', icon: 'assets/buildings/Bloomery_1.png', type: 'building' },
      anvil: { id: 'anvil', name: 'Наковальня', icon: 'assets/buildings/anvil_1.png', type: 'building' }
    };
    // Для тестирования все инструменты сразу доступны в инвентаре.
    Object.values(TOOL_DEFINITIONS).forEach(tool => {
      inventoryItems.push({ ...tool, count: 1, durability: 100, maxDurability: 100 });
    });

      const enough = Object.entries(recipe.ingredients).every(([id, amount]) => getResourceCount(id) >= amount);

        showGameMessage('Недостаточно ингредиентов предметов для создания', 'damage');
        return;

      if (TOOL_DEFINITIONS[recipe.id] && inventoryItems.length >= 16) {

      // Крафт гарантированный: ресурсы списываются только когда хватает всех ингредиентов.
      Object.entries(recipe.ingredients).forEach(([id, amount]) => {
        const stack = inventoryItems.find(item => item.id === id);
        stack.count -= amount;
      });
      for (let i = inventoryItems.length - 1; i >= 0; i--) {
        if (inventoryItems[i].count <= 0) inventoryItems.splice(i, 1);
      }
      const craftedItem = TOOL_DEFINITIONS[recipe.id] || BUILDING_DEFINITIONS[recipe.id] || (RESOURCE_NAMES[recipe.id] ? { id: recipe.id, name: RESOURCE_NAMES[recipe.id], icon: RESOURCE_ICONS[recipe.id] } : null);
      if (!craftedItem) {
        showGameMessage('Ошибка: предмет не найден в базе крафта', 'damage');
        renderInventory();
        return;

      if (TOOL_DEFINITIONS[recipe.id]) {
        inventoryItems.push({ ...craftedItem, count: 1, durability: 100, maxDurability: 100 });

        const existing = inventoryItems.find(item => item.id === craftedItem.id);
        if (existing) existing.count += 1;

    const PLAYER_SPRITES = {
      up:    ['assets/player/GG_1.png', 'assets/player/GG_2.png'],
      right: ['assets/player/GG_3.png', 'assets/player/GG_4.png'],

    // Базовые веса типов местности: 1 — почва, 2 — трава, 3 — каменистая земля.
    // Ландшафт генерируется блоками 2×2 клетки (четыре клетки одного типа).
    // Переходы: трава ↔ почва ↔ камни. Трава и камни напрямую не соприкасаются сторонами.
    const TILE_WEIGHTS = { 1: 25, 2: 50, 3: 25 };
    const BLOCK_SIZE = 2;

    function canNeighbor(tile, neighbor) {
      if (neighbor == null) return true;
      // Трава (2) не соприкасается с камнями (3); почва (1) — переходный тип.
      return !((tile === 2 && neighbor === 3) || (tile === 3 && neighbor === 2));
    }

    function chooseWeightedBlock(leftTile, upperTile) {
      const allowed = [1, 2, 3].filter((tile) =>
        canNeighbor(tile, leftTile) && canNeighbor(tile, upperTile)
      );
      const totalWeight = allowed.reduce((sum, tile) => sum + TILE_WEIGHTS[tile], 0);
      let roll = Math.random() * totalWeight;
      for (const tile of allowed) {
        roll -= TILE_WEIGHTS[tile];
        if (roll < 0) return tile;
      }
      return allowed[allowed.length - 1] ?? 1;
    }

    function generateWorld() {
      const cellSize = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--cell-size')) || 64;
      const columns = 32;
      const rows = 32;
      const terrainFragment = document.createDocumentFragment();
      const objectFragment = document.createDocumentFragment();
      const blockColumns = Math.ceil(columns / BLOCK_SIZE);
      const blockRows = Math.ceil(rows / BLOCK_SIZE);
      const blockMap = Array.from({ length: blockRows }, () => Array(blockColumns).fill(0));
      worldMap = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectMap = Array.from({ length: rows }, () => Array(columns).fill(null));
      objectHitProgress = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectHitRequired = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectElements = Array.from({ length: rows }, () => Array(columns).fill(null));
      worldColumns = columns;
      worldRows = rows;
      worldPixelWidth = columns * cellSize;
      worldPixelHeight = rows * cellSize;

      // Сначала генерируем ландшафт блоками 2×2.
      for (let blockRow = 0; blockRow < blockRows; blockRow++) {
        for (let blockCol = 0; blockCol < blockColumns; blockCol++) {
          const leftTile = blockCol > 0 ? blockMap[blockRow][blockCol - 1] : null;
          const upperTile = blockRow > 0 ? blockMap[blockRow - 1][blockCol] : null;
          const tileId = chooseWeightedBlock(leftTile, upperTile);
          blockMap[blockRow][blockCol] = tileId;
          for (let dy = 0; dy < BLOCK_SIZE; dy++) {
            for (let dx = 0; dx < BLOCK_SIZE; dx++) {
              const row = blockRow * BLOCK_SIZE + dy;
              const col = blockCol * BLOCK_SIZE + dx;
              if (row < rows && col < columns) worldMap[row][col] = tileId;
            }
          }
        }
      }

      // Затем создаём отдельную таблицу объектов по значениям таблицы ландшафта.
      // Трава: дерево в каждой клетке. Каменистая земля: камень с вероятностью 20%.
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const tileId = worldMap[row][col];
          const terrainCell = document.createElement('div');
          terrainCell.className = 'cell';
          terrainCell.dataset.tile = String(tileId);
          terrainCell.style.backgroundImage = `url("${TILE_TEXTURES[tileId]}")`;
          terrainFragment.appendChild(terrainCell);

          let objectType = null;
          if (tileId === 2) {
            objectType = Math.random() < 0.5 ? 'tree1' : 'tree2';
          } else if (tileId === 3 && Math.random() < 0.20) {
            objectType = Math.random() < 0.5 ? 'rock1' : 'rock2';
          }
          objectMap[row][col] = objectType;
          if (objectType === 'tree1' || objectType === 'tree2') {
            objectHitRequired[row][col] = 2 + Math.floor(Math.random() * 5); // 2–6 ударов
          } else if (objectType === 'rock1' || objectType === 'rock2') {
            objectHitRequired[row][col] = 3; // Камень всегда требует 3 удара
          }

          const objectCell = document.createElement('div');
          objectCell.className = 'object-cell';
          objectCell.dataset.row = String(row);
          objectCell.dataset.col = String(col);
          // Нижние строки рисуются поверх верхних: это основа Y-сортировки.
          objectCell.style.zIndex = String((row + 1) * 64);
          if (objectType) {
            const sprite = document.createElement('img');
            sprite.className = `world-object ${objectType === 'tree1' ? 'tree-1' : objectType === 'tree2' ? 'tree-2' : 'rock'}`;
            sprite.src = OBJECT_SPRITES[objectType];
            sprite.alt = '';
            sprite.draggable = false;
            sprite.onerror = () => console.error(`Не удалось загрузить спрайт объекта: ${sprite.src}`);
            objectCell.appendChild(sprite);
          }
          objectElements[row][col] = objectCell;
          objectFragment.appendChild(objectCell);
        }
      }

      terrainLayer.replaceChildren(terrainFragment);
      objectsLayer.replaceChildren(objectFragment);
      // replaceChildren очищает слой, поэтому возвращаем игрока после генерации клеток.
      objectsLayer.appendChild(player);
      objectsLayer.appendChild(placementPreview);
      for (const layer of [terrainLayer, objectsLayer]) {
        layer.style.gridTemplateColumns = `repeat(${columns}, var(--cell-size))`;
        layer.style.gridTemplateRows = `repeat(${rows}, var(--cell-size))`;
        layer.style.width = `${worldPixelWidth}px`;
        layer.style.height = `${worldPixelHeight}px`;
      }

      // Ищем ближайшую свободную клетку для начального появления игрока.
      const centerRow = Math.floor(rows / 2);
      const centerCol = Math.floor(columns / 2);
      let spawn = null;
      for (let radius = 0; radius < Math.max(rows, columns) && !spawn; radius++) {
        for (let row = Math.max(0, centerRow - radius); row <= Math.min(rows - 1, centerRow + radius) && !spawn; row++) {
          for (let col = Math.max(0, centerCol - radius); col <= Math.min(columns - 1, centerCol + radius); col++) {
            if (objectMap[row][col] === null) { spawn = { row, col }; break; }
          }
        }
      }
      if (spawn) {
        worldX = (spawn.col + 0.5) * cellSize - worldPixelWidth / 2;
        worldY = (spawn.row + 0.5) * cellSize - worldPixelHeight / 2;
      } else {
        worldX = 0;
        worldY = 0;
      }
      velocityX = 0;
      velocityY = 0;
      updateCamera();
    }

    function updateCamera() {
      const transform = `translate(calc(-50% - ${worldX}px), calc(-50% - ${worldY}px))`;
      terrainLayer.style.transform = transform;
      objectsLayer.style.transform = transform;

      // Игрок находится в координатах мира внутри objectsLayer.
      // Камера сдвигает весь слой, поэтому игрок остаётся в центре экрана.
      const playerWorldX = worldPixelWidth / 2 + worldX;
      const playerWorldY = worldPixelHeight / 2 + worldY;
      player.style.left = `${playerWorldX}px`;
      player.style.top = `${playerWorldY}px`;

      // Сравниваем точку ног игрока с основанием объектов по оси Y.
      const playerFeetY = playerWorldY + PLAYER_COLLISION_SIZE / 2;
      player.style.zIndex = String(Math.floor(playerFeetY) + 1);
    }

    // Коллизия занимает всю клетку 64×64, где есть дерево или камень.
    // Проверяем движение по осям отдельно, чтобы игрок не проскальзывал между объектами.
    function collidesAt(nextX, nextY) {
      const cellSize = 64;
      const half = PLAYER_COLLISION_SIZE / 2;
      const centerX = worldPixelWidth / 2 + nextX;
      const centerY = worldPixelHeight / 2 + nextY;
      const left = centerX - half;
      const right = centerX + half;
      const top = centerY - half;
      const bottom = centerY + half;
      const minCol = Math.floor(left / cellSize);
      const maxCol = Math.floor((right - 0.001) / cellSize);
      const minRow = Math.floor(top / cellSize);
      const maxRow = Math.floor((bottom - 0.001) / cellSize);
      for (let row = minRow; row <= maxRow; row++) {
        for (let col = minCol; col <= maxCol; col++) {
          if (row < 0 || col < 0 || row >= worldRows || col >= worldColumns) return true;
          if (objectMap[row]?.[col]) return true;
        }
      }
      return false;
    }

    function getPlacementTarget() {
      const centerX = worldPixelWidth / 2 + worldX;
      const centerY = worldPixelHeight / 2 + worldY;
      const offsets = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [dx, dy] = offsets[facing];
      return { col: Math.floor(centerX / 64) + dx, row: Math.floor(centerY / 64) + dy };
    }

    function canPlaceBuilding(row, col) {
      if (row < 0 || col < 0 || row >= worldRows || col >= worldColumns) return false;
      return (worldMap[row][col] === 1 || worldMap[row][col] === 2) && objectMap[row][col] === null;
    }

    function updatePlacementPreview() {
      const selected = quickSlots[selectedQuickSlot];
      if (!selected || !BUILDING_DEFINITIONS[selected.id]) {
        placementPreview.style.display = 'none';
        return;
      }
      const target = getPlacementTarget();
      placementPreview.style.left = `${target.col * 64}px`;
      placementPreview.style.top = `${target.row * 64}px`;
      placementPreview.style.display = 'block';
      placementPreview.classList.toggle('valid', canPlaceBuilding(target.row, target.col));
    }

    function placeBuilding(buildingId) {
      const definition = BUILDING_DEFINITIONS[buildingId];
      if (!definition) return;
      const target = getPlacementTarget();
      if (!canPlaceBuilding(target.row, target.col)) {
        showGameMessage('Здесь нельзя разместить объект', 'damage');
        return;
      }
      const item = inventoryItems.find(entry => entry.id === buildingId && entry.count > 0);
      if (!item) {
        showGameMessage(`${definition.name} не найден в инвентаре`, 'damage');
        return;
      }
      item.count -= 1;
      if (item.count <= 0) inventoryItems.splice(inventoryItems.indexOf(item), 1);
      for (let i = 0; i < quickSlots.length; i++) {
        if (quickSlots[i]?.id === buildingId) quickSlots[i] = null;
      }
      objectMap[target.row][target.col] = buildingId;
      const cell = objectElements[target.row]?.[target.col];
      if (cell) {
        const marker = document.createElement('img');
        marker.className = `workbench-marker ${buildingId}`;
        marker.src = definition.icon;
        marker.alt = definition.name;
        marker.draggable = false;
        marker.onerror = () => console.error(`Не удалось загрузить спрайт: ${marker.src}`);
        cell.appendChild(marker);
      }
      renderInventory();
      updatePlacementPreview();
      showGameMessage(`${definition.name} установлен${buildingId === 'anvil' ? 'а' : ''}`, 'resource');
      markSaveDirty();
    }

    const HIT_HEALTH_COST = 2;
    let hitFeedbackTimer = 0;
    function performHit() {
      const cellSize = 64;
      const centerX = worldPixelWidth / 2 + worldX;
      const centerY = worldPixelHeight / 2 + worldY;
      const offsets = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [dx, dy] = offsets[facing];
      const col = Math.floor(centerX / cellSize) + dx;
      const row = Math.floor(centerY / cellSize) + dy;
      const objectType = objectMap[row]?.[col];
      actionButton.classList.add('hit');
      hitFeedbackTimer = 0.18;

      if (!objectType) {
        showGameMessage('Перед вами нет объекта для удара.', 'damage');
        return;
      }

      if (objectType === 'furnace' || objectType === 'anvil') {
        showGameMessage('Этот мастерской объект нельзя разрушить таким способом.', 'damage');
        return;
      }
      const targetKind = objectType === 'workbench'
        ? 'workbench'
        : (objectType.startsWith('tree') ? 'tree' : 'rock');
      const targetName = targetKind === 'tree' ? 'дереву'
        : targetKind === 'rock' ? 'камню' : 'верстаку';
      const selectedItem = quickSlots[selectedQuickSlot];
      const isAxe = Boolean(selectedItem?.toolFor === 'tree');
      const isPickaxe = Boolean(selectedItem?.toolFor === 'rock');

      // Верстак нельзя разбирать киркой: действие прекращается без урона и прогресса.
      if (targetKind === 'workbench' && isPickaxe) {
        showGameMessage('Я не могу сломать верстак киркой.', 'damage');
        return;
      }

      const correctTool = targetKind === 'workbench'
        ? (isAxe ? selectedItem : null)
        : (selectedItem?.toolFor === targetKind ? selectedItem : null);

      if (correctTool) {
        showGameMessage(`Вы ударили по ${targetName} инструментом: ${correctTool.name}.`, 'resource');
      } else {
        showGameMessage(`Вы ударили по ${targetName} рукой.`, 'damage');
        health = Math.max(0, health - HIT_HEALTH_COST);
        showGameMessage(`Вы получили ${HIT_HEALTH_COST} урона.`, 'damage');
      }

      if (selectedItem && Number.isFinite(selectedItem.durability)) {
        selectedItem.durability = Math.max(0, selectedItem.durability - 1);
        if (selectedItem.durability === 0) {
          const itemIndex = inventoryItems.indexOf(selectedItem);
          if (itemIndex >= 0) inventoryItems.splice(itemIndex, 1);
          for (let slotIndex = 0; slotIndex < quickSlots.length; slotIndex++) {
            if (quickSlots[slotIndex] === selectedItem) quickSlots[slotIndex] = null;
          }
          showGameMessage(`${selectedItem.name} сломался.`, 'damage');
        } else if (selectedItem.durability <= selectedItem.maxDurability * 0.2) {
          showGameMessage(`Прочность ${selectedItem.name}: ${selectedItem.durability}/${selectedItem.maxDurability}`, 'damage');
        }
        renderInventory();
      }

      objectHitProgress[row][col] += 1;
      const required = objectHitRequired[row][col] || (targetKind === 'tree' ? 2 : 3);

      if (objectHitProgress[row][col] >= required) {
        // Верстак всегда возвращает одну древесину; инструменты не увеличивают добычу.
        const amount = targetKind === 'workbench' ? 1 : (correctTool ? correctTool.yield : 1);
        const resourceId = targetKind === 'rock' ? 'stone' : 'wood';
        addResource(resourceId, amount);
        const destroyedName = targetKind === 'tree' ? 'Дерево' : targetKind === 'rock' ? 'Камень' : 'Верстак';
        showGameMessage(`${destroyedName} разрушен.`, 'resource');
        showGameMessage(`Получено: ${RESOURCE_NAMES[resourceId]} +${amount}.`, 'resource');

        // При добыче каждого камня отдельно проверяем шанс найти уголь и железную руду.
        // Проверки независимы: за один камень могут выпасть оба дополнительных ресурса.
        if (targetKind === 'rock' && Math.random() < 0.20) {
          addResource('coal', 1);
          showGameMessage('Найдено: Уголь +1!', 'resource');
        }
        if (targetKind === 'rock' && Math.random() < 0.05) {
          addResource('iron_ore', 1);
          showGameMessage('Найдена: Железная руда +1!', 'resource');
        }

        objectMap[row][col] = null;
        objectHitProgress[row][col] = 0;
        objectHitRequired[row][col] = 0;
        const objectCell = objectElements[row]?.[col];
        if (objectCell) objectCell.replaceChildren();
      }
      healthValueElement.textContent = String(health);
      markSaveDirty();
    }
    function performAction() { const selected = quickSlots[selectedQuickSlot]; if (selected && BUILDING_DEFINITIONS[selected.id]) placeBuilding(selected.id); else performHit(); }

    const interactButton = document.getElementById('interact-button');
    function performInteraction() {

              { id: 'steel_axe', name: 'Стальной топор', ingredients: { steel_ingot: 2, wood: 1 }, action: '⚒ СОЗДАТЬ' },

          resultIcon.alt = recipe.name;
          resultIcon.style.cssText = 'width:42px;height:42px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:10px;';
          title.append(resultIcon, document.createTextNode(recipe.name));
          card.appendChild(title);

          const body = document.createElement('div');

          Object.entries(recipe.ingredients).forEach(([id, amount], index) => {
            if (index) {

              plus.textContent = '+';
              body.appendChild(plus);
            }
            const ingredient = document.createElement('div');
            ingredient.className = 'craft-ingredient';
            const image = document.createElement('img');
            image.src = RESOURCE_ICONS[id];
            image.alt = RESOURCE_NAMES[id];
            ingredient.appendChild(image);
            const quantity = document.createElement('span');
            quantity.textContent = `x${amount}`;
            ingredient.appendChild(quantity);
            body.appendChild(ingredient);
          });
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'craft-create';
          button.textContent = recipe.action;
          button.addEventListener('click', () => craftItem(recipe));
          body.appendChild(button);
          card.appendChild(body);
          craftRecipesElement.appendChild(card);
        });
        craftOverlay.classList.add('open');
        showGameMessage(`Вы взаимодействуете: ${isFurnace ? 'горн' : 'наковальня'}.`, 'resource');
        return;
      }
      const objectName = objectType.startsWith('tree') ? 'деревом' : 'камнем';
      showGameMessage(`С ${objectName} пока нельзя взаимодействовать.`, 'damage');
    }
    interactButton.addEventListener('click', performInteraction); 
    actionButton.addEventListener('click', performAction);
    window.addEventListener('keydown', event => {
      if (event.key >= '1' && event.key <= '4') {

      }
      if (event.code === 'Space' && !event.repeat) { event.preventDefault(); performAction(); }
      if (event.code === 'KeyE' && !event.repeat) { event.preventDefault(); performInteraction(); }

    function setDirection(direction, isDown) {
      if (isDown) pressed.add(direction);
      else pressed.delete(direction);
    }

    // Экранные стрелки поддерживают удержание мышью и пальцем.
    document.querySelectorAll('.direction').forEach((button) => {
      const direction = button.id;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture?.(event.pointerId);
        setDirection(direction, true);
      });
      const release = (event) => {
        event.preventDefault();
        setDirection(direction, false);
      };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', () => setDirection(direction, false));
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('keydown', (event) => {
      const direction = keyDirections[event.code];
      if (!direction) return;
      event.preventDefault();
      pressed.add(direction);
    });
    window.addEventListener('keyup', (event) => {
      const direction = keyDirections[event.code];
      if (!direction) return;
      event.preventDefault();
      pressed.delete(direction);
    });
    window.addEventListener('blur', () => pressed.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pressed.clear();
    });

    let previousTime = 0;
    function frame(time) {
      const dt = previousTime ? Math.min((time - previousTime) / 1000, 0.033) : 0;
      previousTime = time;

      let inputX = (pressed.has('right') ? 1 : 0) - (pressed.has('left') ? 1 : 0);
      let inputY = (pressed.has('down') ? 1 : 0) - (pressed.has('up') ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY);
      if (inputLength > 0) {
        inputX /= inputLength;
        inputY /= inputLength;

        // Направление взгляда следует за последним активным вводом.
        if (Math.abs(inputX) > Math.abs(inputY)) facing = inputX > 0 ? 'right' : 'left';
        else facing = inputY > 0 ? 'down' : 'up';

        const dot = velocityX * inputX + velocityY * inputY;
        if (dot < 0) {
          velocityX *= Math.exp(-TURN_DRAG * dt);
          velocityY *= Math.exp(-TURN_DRAG * dt);
        }
        velocityX += inputX * ACCELERATION * dt;
        velocityY += inputY * ACCELERATION * dt;
      } else {
        const damping = Math.exp(-FRICTION * dt);
        velocityX *= damping;
        velocityY *= damping;
      }

      const speed = Math.hypot(velocityX, velocityY);
      if (speed > MAX_SPEED) {
        velocityX = velocityX / speed * MAX_SPEED;
        velocityY = velocityY / speed * MAX_SPEED;
      }

      const nextX = worldX + velocityX * dt;
      const nextY = worldY + velocityY * dt;
      if (!collidesAt(nextX, worldY)) worldX = nextX;
      else velocityX = 0;
      if (!collidesAt(worldX, nextY)) worldY = nextY;
      else velocityY = 0;

      if (pressed.size === 0 && Math.hypot(velocityX, velocityY) < 2) {
        velocityX = 0;
        velocityY = 0;
      }

      const actualSpeed = Math.hypot(velocityX, velocityY);
      if (actualSpeed > WALK_THRESHOLD) {
        animationTimer += dt;
        if (animationTimer >= WALK_FRAME_DURATION) {
          animationTimer %= WALK_FRAME_DURATION;
          animationFrame = 1 - animationFrame;
        }
      } else {
        animationTimer = 0;
        animationFrame = 0;
      }

      setPlayerSprite(facing, actualSpeed > WALK_THRESHOLD ? animationFrame : 0);
      updateCamera();
      updatePlacementPreview();
      if (hitFeedbackTimer > 0) {
        hitFeedbackTimer -= dt;
        if (hitFeedbackTimer <= 0) actionButton.classList.remove('hit');
      }
      requestAnimationFrame(frame);
    }


    // -------------------- СИСТЕМА СОХРАНЕНИЙ ROCK LAND --------------------
    const worldMenu = document.getElementById('world-menu');
    const worldSlotsElement = document.getElementById('world-slots');
    const worldMenuStatus = document.getElementById('world-menu-status');
    const worldNameDialog = document.getElementById('world-name-dialog');
    const worldNameInput = document.getElementById('world-name-input');

    function openSaveDatabase() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('Этот браузер не поддерживает IndexedDB.'));
          return;
        }
        const request = indexedDB.open(SAVE_DB_NAME, SAVE_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('worlds')) db.createObjectStore('worlds', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Не удалось открыть базу сохранений.'));
      });
    }

    function dbRequest(storeName, mode, operation) {
      return new Promise((resolve, reject) => {
        const tx = saveDatabase.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        let request;
        let result;
        try { request = operation(store); }
        catch (error) { reject(error); return; }
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => reject(request.error || new Error('Ошибка запроса к базе данных.'));
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error || new Error('Ошибка базы данных.'));
        tx.onabort = () => reject(tx.error || new Error('Транзакция базы данных отменена.'));
      });
    }

    function makeStarterInventory() {
      inventoryItems.splice(0, inventoryItems.length);
      Object.values(TOOL_DEFINITIONS).forEach(tool => {
        inventoryItems.push({ ...tool, count: 1, durability: 100, maxDurability: 100 });
      });
      inventoryItems.push(
        { id: 'wood', name: 'Древесина', count: 99, icon: RESOURCE_ICONS.wood },
        { id: 'stone', name: 'Камень', count: 99, icon: RESOURCE_ICONS.stone },
        { id: 'coal', name: 'Уголь', count: 99, icon: RESOURCE_ICONS.coal },
        { id: 'iron_ore', name: 'Железная руда', count: 99, icon: RESOURCE_ICONS.iron_ore }
      );
      quickSlots.fill(null);
      selectedQuickSlot = 0;
      health = MAX_HEALTH;
    }

    function serializeWorldState() {
      const quickIndexes = quickSlots.map(item => item ? inventoryItems.indexOf(item) : -1);
      return {
        schemaVersion: 1,
        savedAt: Date.now(),
        world: {
          columns: worldColumns,
          rows: worldRows,
          terrain: worldMap.map(row => row.slice()),
          objects: objectMap.map(row => row.slice()),
          hitProgress: objectHitProgress.map(row => row.slice()),
          hitRequired: objectHitRequired.map(row => row.slice())
        },
        player: {
          x: worldX, y: worldY, health,
          facing,
          selectedQuickSlot,
          quickIndexes
        },
        inventory: inventoryItems.map(item => ({ ...item }))
      };
    }

    function isValidWorldState(state) {
      if (!state || state.schemaVersion !== 1 || !state.world || !state.player) return false;
      const rows = state.world.rows, cols = state.world.columns;
      if (rows !== 32 || cols !== 32) return false;
      const validGrid = grid => Array.isArray(grid) && grid.length === rows &&
        grid.every(row => Array.isArray(row) && row.length === cols);
      return validGrid(state.world.terrain) && validGrid(state.world.objects) &&
        validGrid(state.world.hitProgress) && validGrid(state.world.hitRequired) &&
        Array.isArray(state.inventory) && state.inventory.length <= 16 &&
        Array.isArray(state.player.quickIndexes) && state.player.quickIndexes.length === 4 &&
        Number.isFinite(state.player.x) && Number.isFinite(state.player.y) &&
        Number.isFinite(state.player.health);
    }

    function renderWorldFromState() {
      const cellSize = 64;
      worldRows = worldMap.length;
      worldColumns = worldMap[0]?.length || 0;
      worldPixelWidth = worldColumns * cellSize;
      worldPixelHeight = worldRows * cellSize;
      objectElements = Array.from({ length: worldRows }, () => Array(worldColumns).fill(null));
      const terrainFragment = document.createDocumentFragment();
      const objectFragment = document.createDocumentFragment();

      for (let row = 0; row < worldRows; row++) {
        for (let col = 0; col < worldColumns; col++) {
          const tileId = worldMap[row][col];
          const terrainCell = document.createElement('div');
          terrainCell.className = 'cell';
          terrainCell.dataset.tile = String(tileId);
          terrainCell.style.backgroundImage = `url("${TILE_TEXTURES[tileId]}")`;
          terrainFragment.appendChild(terrainCell);

          const objectType = objectMap[row][col];
          const objectCell = document.createElement('div');
          objectCell.className = 'object-cell';
          objectCell.dataset.row = String(row);
          objectCell.dataset.col = String(col);
          objectCell.style.zIndex = String((row + 1) * 64);
          if (objectType) {
            const sprite = document.createElement('img');
            if (BUILDING_DEFINITIONS[objectType]) {
              sprite.className = `workbench-marker ${objectType}`;
              sprite.src = BUILDING_DEFINITIONS[objectType].icon;
              sprite.alt = BUILDING_DEFINITIONS[objectType].name;
            } else {
              sprite.className = `world-object ${objectType === 'tree1' ? 'tree-1' : objectType === 'tree2' ? 'tree-2' : 'rock'}`;
              sprite.src = OBJECT_SPRITES[objectType];
              sprite.alt = '';
            }
            sprite.draggable = false;
            objectCell.appendChild(sprite);
          }
          objectElements[row][col] = objectCell;
          objectFragment.appendChild(objectCell);
        }
      }

      terrainLayer.replaceChildren(terrainFragment);
      objectsLayer.replaceChildren(objectFragment);
      objectsLayer.appendChild(player);
      objectsLayer.appendChild(placementPreview);
      for (const layer of [terrainLayer, objectsLayer]) {
        layer.style.gridTemplateColumns = `repeat(${worldColumns}, var(--cell-size))`;
        layer.style.gridTemplateRows = `repeat(${worldRows}, var(--cell-size))`;
        layer.style.width = `${worldPixelWidth}px`;
        layer.style.height = `${worldPixelHeight}px`;
      }
      updateCamera();
      updatePlacementPreview();
    }

    async function saveCurrentWorld(force = false) {
      if (!activeWorldId || !saveDatabase || saveInProgress || (!saveDirty && !force)) return true;
      saveInProgress = true;
      const snapshot = serializeWorldState();
      try {
        await new Promise((resolve, reject) => {
          const tx = saveDatabase.transaction('worlds', 'readwrite');
          const store = tx.objectStore('worlds');
          const getRequest = store.get(activeWorldId);
          getRequest.onsuccess = () => {
            const record = getRequest.result;
            if (!record) {
              reject(new Error('Слот мира не найден.'));
              tx.abort();
              return;
            }
            if (record.state && isValidWorldState(record.state)) record.backup = record.state;
            record.state = snapshot;
            record.updatedAt = Date.now();
            record.name = activeWorldName;
            store.put(record);
          };
          getRequest.onerror = () => reject(getRequest.error);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Не удалось сохранить мир.'));
          tx.onabort = () => reject(tx.error || new Error('Сохранение отменено.'));
        });
        saveDirty = false;
        lastSavedAt = Date.now();
        return true;
      } catch (error) {
        console.error('Rock Land save error:', error);
        worldMenuStatus.textContent = 'Ошибка сохранения. Попробуйте ещё раз.';
        showGameMessage('Ошибка сохранения мира!', 'damage');
        return false;
      } finally {
        saveInProgress = false;
      }
    }

    function markSaveDirty() {
      if (!activeWorldId) return;
      saveDirty = true;
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => { saveCurrentWorld(); }, 700);
    }

    async function refreshWorldMenu() {
      const records = await dbRequest('worlds', 'readonly', store => store.getAll());
      records.sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
      worldSlotsElement.replaceChildren();
      for (let index = 0; index < MAX_WORLDS; index++) {
        const record = records[index];
        const slot = document.createElement('div');
        slot.className = 'world-slot';
        const info = document.createElement('div');
        info.className = 'world-slot-info';
        const name = document.createElement('div');
        name.className = 'world-slot-name';
        name.textContent = record ? record.name : `СЛОТ ${index + 1} — ПУСТО`;
        info.appendChild(name);
        const meta = document.createElement('div');
        meta.className = 'world-slot-meta';
        meta.textContent = record
          ? `Последнее сохранение: ${new Date(record.updatedAt || record.createdAt).toLocaleString('ru-RU')}`
          : 'Можно создать новый мир';
        info.appendChild(meta);
        slot.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'world-slot-actions';
        if (record) {
          const play = document.createElement('button');
          play.className = 'world-menu-button';
          play.textContent = 'ИГРАТЬ';
          play.addEventListener('click', () => loadWorld(record.id));
          actions.appendChild(play);

          const remove = document.createElement('button');
          remove.className = 'world-menu-button danger';
          remove.textContent = 'УДАЛИТЬ';
          remove.addEventListener('click', async () => {
            if (!confirm(`Удалить мир «${record.name}»? Это действие нельзя отменить.`)) return;
            await dbRequest('worlds', 'readwrite', store => store.delete(record.id));
            worldMenuStatus.textContent = 'Мир удалён.';
            refreshWorldMenu();
          });
          actions.appendChild(remove);
        } else {
          const create = document.createElement('button');
          create.className = 'world-menu-button';
          create.textContent = 'СОЗДАТЬ';
          create.disabled = records.length >= MAX_WORLDS;
          create.addEventListener('click', () => {
            worldNameDialog.classList.add('open');
            worldNameInput.value = `Мир ${index + 1}`;
            worldNameInput.focus();
          });
          actions.appendChild(create);
        }
        slot.appendChild(actions);
        worldSlotsElement.appendChild(slot);
      }
      const count = Math.min(records.length, MAX_WORLDS);
      worldMenuStatus.textContent = `${count} / ${MAX_WORLDS} миров занято`;
    }

    async function createNewWorld(name) {
      const records = await dbRequest('worlds', 'readonly', store => store.getAll());
      if (records.length >= MAX_WORLDS) {
        worldMenuStatus.textContent = 'Все пять слотов заняты. Удалите один мир.';
        return;
      }
      makeStarterInventory();
      generateWorld();
      activeWorldId = (window.crypto?.randomUUID ? window.crypto.randomUUID() : `world_${Date.now()}_${Math.random().toString(16).slice(2)}`);
      activeWorldName = name.trim().slice(0, 32) || `Мир ${records.length + 1}`;
      const now = Date.now();
      const record = {
        id: activeWorldId, name: activeWorldName, createdAt: now, updatedAt: now,
        state: serializeWorldState(), backup: null
      };
      await dbRequest('worlds', 'readwrite', store => store.add(record));
      saveDirty = false;
      lastSavedAt = now;
      worldNameDialog.classList.remove('open');
      worldMenu.hidden = true;
      document.getElementById('game').style.display = '';
      renderInventory();
      startWorldTimers();
      showGameMessage(`Мир «${activeWorldName}» создан.`, 'resource');
    }

    async function loadWorld(worldId) {
      worldMenuStatus.textContent = 'Загрузка мира...';
      const record = await dbRequest('worlds', 'readonly', store => store.get(worldId));
      if (!record) {
        worldMenuStatus.textContent = 'Мир не найден.';
        return;
      }
      if (!isValidWorldState(record.state)) {
        if (record.backup && isValidWorldState(record.backup)) {
          const restore = confirm(`Основное сохранение мира «${record.name}» повреждено. Восстановить резервную копию?`);
          if (!restore) return;
          record.state = record.backup;
          await dbRequest('worlds', 'readwrite', store => store.put(record));
        } else {
          worldMenuStatus.textContent = 'Сохранение повреждено, резервной копии нет.';
          return;
        }
      }
      const state = record.state;
      activeWorldId = record.id;
      activeWorldName = record.name;
      worldMap = state.world.terrain.map(row => row.slice());
      objectMap = state.world.objects.map(row => row.slice());
      objectHitProgress = state.world.hitProgress.map(row => row.slice());
      objectHitRequired = state.world.hitRequired.map(row => row.slice());
      inventoryItems.splice(0, inventoryItems.length, ...state.inventory.map(item => ({ ...item })));
      quickSlots.splice(0, quickSlots.length, ...state.player.quickIndexes.map(index => index >= 0 ? inventoryItems[index] || null : null));
      while (quickSlots.length < 4) quickSlots.push(null);
      selectedQuickSlot = Math.max(0, Math.min(3, state.player.selectedQuickSlot || 0));
      worldX = state.player.x;
      worldY = state.player.y;
      health = Math.max(0, Math.min(MAX_HEALTH, Number(state.player.health) || 0));
      facing = ['up','down','left','right'].includes(state.player.facing) ? state.player.facing : 'down';
      velocityX = 0;
      velocityY = 0;
      renderWorldFromState();
      renderInventory();
      currentSprite = '';
      setPlayerSprite(facing, 0);
      saveDirty = false;
      worldMenu.hidden = true;
      document.getElementById('game').style.display = '';
      startWorldTimers();
      worldMenuStatus.textContent = '';
      showGameMessage(`Мир «${activeWorldName}» загружен.`, 'resource');
    }

    function startWorldTimers() {
      clearInterval(autoSaveTimer);
      autoSaveTimer = setInterval(() => saveCurrentWorld(true), SAVE_INTERVAL_MS);
    }

    async function returnToWorldMenu() {
      clearTimeout(saveDebounceTimer);
      const saved = await saveCurrentWorld(true);
      if (!saved) return;
      clearInterval(autoSaveTimer);
      activeWorldId = null;
      activeWorldName = '';
      pressed.clear();
      inventoryOverlay.classList.remove('open');
      craftOverlay.classList.remove('open');
      document.getElementById('game').style.display = 'none';
      worldMenu.hidden = false;
      await refreshWorldMenu();
    }

    async function initializeSaveSystem() {
      try {
        saveDatabase = await openSaveDatabase();
        // Настройки хранятся отдельно и общие для всех миров.
        const settings = await dbRequest('settings', 'readonly', store => store.get('global'));
        if (!settings) await dbRequest('settings', 'readwrite', store => store.put({ id: 'global', values: {} }));
        document.getElementById('world-save-button').addEventListener('click', async () => {
          const saved = await saveCurrentWorld(true);
          if (saved) showGameMessage('Мир сохранён.', 'resource');
        });
        document.getElementById('world-exit-button').addEventListener('click', returnToWorldMenu);
        document.getElementById('world-create-confirm').addEventListener('click', async () => {
          try { await createNewWorld(worldNameInput.value); }
          catch (error) { console.error(error); worldMenuStatus.textContent = 'Не удалось создать мир.'; }
        });
        document.getElementById('world-create-cancel').addEventListener('click', () => worldNameDialog.classList.remove('open'));
        worldNameInput.addEventListener('keydown', event => {
          if (event.key === 'Enter') document.getElementById('world-create-confirm').click();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && activeWorldId) saveCurrentWorld(true);
        });
        window.addEventListener('pagehide', () => {
          // Best-effort only: браузер может завершить страницу до окончания асинхронной записи.
          if (activeWorldId && saveDatabase && saveDirty) saveCurrentWorld(true);
        });
        worldMenu.hidden = false;
        await refreshWorldMenu();
      } catch (error) {
        console.error('Rock Land storage initialization failed:', error);
        worldMenu.hidden = false;
        worldMenuStatus.textContent = 'Не удалось открыть локальное хранилище. Проверьте поддержку IndexedDB.';
      }
    }
    // ------------------ КОНЕЦ СИСТЕМЫ СОХРАНЕНИЙ ------------------

    // Предзагружаем графику, чтобы смена кадров не мигала.
    [...Object.values(TILE_TEXTURES), ...Object.values(PLAYER_SPRITES).flat(), ...Object.values(OBJECT_SPRITES), ...Object.values(TOOL_DEFINITIONS).map(tool => tool.icon), ...Object.values(RESOURCE_ICONS)].forEach((src) => {
      const image = new Image();
      image.onerror = () => console.error(`Не удалось загрузить изображение: ${src}`);
      image.src = src;
    });

    window.addEventListener('resize', () => { updateCamera(); updatePlacementPreview(); });
    setPlayerSprite('down', 0);
    renderInventory();
    document.getElementById('game').style.display = 'none';
    initializeSaveSystem();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
