    // Базовые веса типов местности: 1 — почва, 2 — трава, 3 — каменистая земля.
    // Ландшафт генерируется блоками 2×2 клетки (четыре клетки одного типа).
    // Переходы: трава ↔ почва ↔ камни. Трава и камни напрямую не соприкасаются сторонами.
    const TILE_WEIGHTS = { 1: 25, 2: 50, 3: 25 };
    const BLOCK_SIZE = 2;

    function canNeighbor(tile, neighbor) {
      if (neighbor == null) return true;
      // Трава (2) не соприкасается с камнями (3); почва (1) — переходный тип.
      return !((tile === 2 && neighbor === 3) || (tile === 3 && neighbor === 2));
    }

    function chooseWeightedBlock(leftTile, upperTile) {
      const allowed = [1, 2, 3].filter((tile) =>
        canNeighbor(tile, leftTile) && canNeighbor(tile, upperTile)
      );
      const totalWeight = allowed.reduce((sum, tile) => sum + TILE_WEIGHTS[tile], 0);
      let roll = Math.random() * totalWeight;
      for (const tile of allowed) {
        roll -= TILE_WEIGHTS[tile];
        if (roll < 0) return tile;
      }
      return allowed[allowed.length - 1] ?? 1;
    }

    function generateWorld() {
      const cellSize = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--cell-size')) || 64;
      const columns = 32;
      const rows = 32;
      const terrainFragment = document.createDocumentFragment();
      const objectFragment = document.createDocumentFragment();
      const blockColumns = Math.ceil(columns / BLOCK_SIZE);
      const blockRows = Math.ceil(rows / BLOCK_SIZE);
      const blockMap = Array.from({ length: blockRows }, () => Array(blockColumns).fill(0));
      worldMap = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectMap = Array.from({ length: rows }, () => Array(columns).fill(null));
      objectHitProgress = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectHitRequired = Array.from({ length: rows }, () => Array(columns).fill(0));
      objectElements = Array.from({ length: rows }, () => Array(columns).fill(null));
      worldColumns = columns;
      worldRows = rows;
      worldPixelWidth = columns * cellSize;
      worldPixelHeight = rows * cellSize;

      // Сначала генерируем ландшафт блоками 2×2.
      for (let blockRow = 0; blockRow < blockRows; blockRow++) {
        for (let blockCol = 0; blockCol < blockColumns; blockCol++) {
          const leftTile = blockCol > 0 ? blockMap[blockRow][blockCol - 1] : null;
          const upperTile = blockRow > 0 ? blockMap[blockRow - 1][blockCol] : null;
          const tileId = chooseWeightedBlock(leftTile, upperTile);
          blockMap[blockRow][blockCol] = tileId;
          for (let dy = 0; dy < BLOCK_SIZE; dy++) {
            for (let dx = 0; dx < BLOCK_SIZE; dx++) {
              const row = blockRow * BLOCK_SIZE + dy;
              const col = blockCol * BLOCK_SIZE + dx;
              if (row < rows && col < columns) worldMap[row][col] = tileId;
            }
          }
        }
      }

      // Выбираем одну свободную клетку каменистой почвы под единственный источник воды.
      const springCandidates = [];
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          if (worldMap[row][col] === 3) springCandidates.push({ row, col });
        }
      }
      // Если на каменистой почве пока нет свободной клетки, освобождаем одну подходящую клетку.
      let springCell = springCandidates.find(({ row, col }) => {
        const rockChance = Math.random();
        return rockChance >= 0.20;
      }) || springCandidates[0] || null;

      // Затем создаём отдельную таблицу объектов по значениям таблицы ландшафта.
      // Трава: дерево в каждой клетке. Каменистая земля: камень с вероятностью 20%.
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const tileId = worldMap[row][col];
          const terrainCell = document.createElement('div');
          terrainCell.className = 'cell';
          terrainCell.dataset.tile = String(tileId);
          terrainCell.style.backgroundImage = `url("${TILE_TEXTURES[tileId]}")`;
          terrainFragment.appendChild(terrainCell);

          let objectType = null;
          if (tileId === 2) {
            objectType = Math.random() < 0.5 ? 'tree1' : 'tree2';
          } else if (tileId === 3 && Math.random() < 0.20) {
            objectType = Math.random() < 0.5 ? 'rock1' : 'rock2';
          }
          objectMap[row][col] = objectType;
          if (objectType === 'tree1' || objectType === 'tree2') {
            objectHitRequired[row][col] = 2 + Math.floor(Math.random() * 5); // 2–6 ударов
          } else if (objectType === 'rock1' || objectType === 'rock2') {
            objectHitRequired[row][col] = 3; // Камень всегда требует 3 удара
          }

          const objectCell = document.createElement('div');
          objectCell.className = 'object-cell';
          objectCell.dataset.row = String(row);
          objectCell.dataset.col = String(col);
          // Нижние строки рисуются поверх верхних: это основа Y-сортировки.
          objectCell.style.zIndex = String((row + 1) * 64);
          if (objectType) {
            const sprite = document.createElement('img');
            sprite.className = `world-object ${objectType === 'tree1' ? 'tree-1' : objectType === 'tree2' ? 'tree-2' : 'rock'}`;
            sprite.src = OBJECT_SPRITES[objectType];
            sprite.alt = '';
            sprite.draggable = false;
            sprite.onerror = () => console.error(`Не удалось загрузить спрайт объекта: ${sprite.src}`);
            objectCell.appendChild(sprite);
          }
          objectElements[row][col] = objectCell;
          objectFragment.appendChild(objectCell);
        }
      }

      if (springCell) {
        const { row, col } = springCell;
        objectMap[row][col] = 'spring';
        objectHitProgress[row][col] = 0;
        objectHitRequired[row][col] = 0;
        const springObjectCell = objectElements[row][col];
        const springSprite = document.createElement('img');
        springSprite.className = 'world-object spring';
        springSprite.src = OBJECT_SPRITES.spring;
        springSprite.alt = 'Источник воды';
        springSprite.draggable = false;
        springSprite.onerror = () => console.error(`Не удалось загрузить спрайт источника воды: ${springSprite.src}`);
        springObjectCell.replaceChildren(springSprite);
        springState = { row, col, sipsLeft: SPRING_MAX_SIPS, restoreAt: 0 };
      }

      terrainLayer.replaceChildren(terrainFragment);
      objectsLayer.replaceChildren(objectFragment);
      // replaceChildren очищает слой, поэтому возвращаем игрока после генерации клеток.
      objectsLayer.appendChild(player);
      objectsLayer.appendChild(placementPreview);
      pigMobs = [];
      banditMobs = [];
      for (const layer of [terrainLayer, objectsLayer]) {
        layer.style.gridTemplateColumns = `repeat(${columns}, var(--cell-size))`;
        layer.style.gridTemplateRows = `repeat(${rows}, var(--cell-size))`;
        layer.style.width = `${worldPixelWidth}px`;
        layer.style.height = `${worldPixelHeight}px`;
      }

      // Ищем ближайшую свободную клетку для начального появления игрока.
      const centerRow = Math.floor(rows / 2);
      const centerCol = Math.floor(columns / 2);
      let spawn = null;
      for (let radius = 0; radius < Math.max(rows, columns) && !spawn; radius++) {
        for (let row = Math.max(0, centerRow - radius); row <= Math.min(rows - 1, centerRow + radius) && !spawn; row++) {
          for (let col = Math.max(0, centerCol - radius); col <= Math.min(columns - 1, centerCol + radius); col++) {
            if (objectMap[row][col] === null) { spawn = { row, col }; break; }
          }
        }
      }
      if (spawn) {
        worldX = (spawn.col + 0.5) * cellSize - worldPixelWidth / 2;
        worldY = (spawn.row + 0.5) * cellSize - worldPixelHeight / 2;
      } else {
        worldX = 0;
        worldY = 0;
      }
      respawnX = worldX;
      respawnY = worldY;
      velocityX = 0;
      velocityY = 0;
      spawnPigMobs();
      spawnBanditMobs();
      updateCamera();
    }

    function isPigCellFree(row, col) {
      return row >= 0 && col >= 0 && row < worldRows && col < worldColumns &&
        (worldMap[row][col] === 1 || worldMap[row][col] === 2) && objectMap[row][col] === null;
    }

    function spawnPigMobs() {
      pigMobs = [];
      const candidates = [];
      for (let row = 1; row < worldRows - 1; row++) {
        for (let col = 1; col < worldColumns - 1; col++) {
          if (!isPigCellFree(row, col)) continue;
          // Предпочитаем открытые клетки рядом с лесом, но не внутри деревьев.
          let nearForest = false;
          for (let dy = -2; dy <= 2 && !nearForest; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const object = objectMap[row + dy]?.[col + dx];
              if (object === 'tree1' || object === 'tree2') { nearForest = true; break; }
            }
          }
          if (nearForest) candidates.push({ row, col });
        }
      }
      // Если подходящих опушек мало, используем любые свободные клетки равнин.
      if (candidates.length < 3) {
        for (let row = 1; row < worldRows - 1; row++) {
          for (let col = 1; col < worldColumns - 1; col++) {
            if (isPigCellFree(row, col) && !candidates.some(c => c.row === row && c.col === col)) candidates.push({ row, col });
          }
        }
      }
      const wanted = 3 + Math.floor(Math.random() * 3);
      for (let attempt = 0; attempt < wanted * 20 && pigMobs.length < wanted && candidates.length; attempt++) {
        const index = Math.floor(Math.random() * candidates.length);
        const cell = candidates.splice(index, 1)[0];
        if (pigMobs.some(p => Math.hypot(p.homeX - (cell.col + 0.5) * 64, p.homeY - (cell.row + 0.5) * 64) < 5 * 64)) continue;
        const x = (cell.col + 0.5) * 64;
        const y = (cell.row + 0.5) * 64;
        const pig = {
          x, y, homeX: x, homeY: y,
          roamRadius: (5 + Math.floor(Math.random() * 6)) * 64,
          targetX: x, targetY: y,
          direction: 'down', frame: 0, frameTimer: 0,
          waitTimer: Math.random() * 2,
          health: 30, fleeTimer: 0,
          element: document.createElement('img')
        };
        pig.element.className = 'good-mob';
        pig.element.alt = '';
        pig.element.draggable = false;
        pig.element.src = PIG_SPRITES.down[0];
        pig.element.onerror = () => console.error(`Не удалось загрузить спрайт свиньи: ${pig.element.src}`);
        objectsLayer.appendChild(pig.element);
        pigMobs.push(pig);
      }
      updatePigSpritesAndPositions();
    }

    function updatePigSpritesAndPositions() {
      for (const pig of pigMobs) {
        pig.element.style.left = `${pig.x}px`;
        pig.element.style.top = `${pig.y}px`;
        pig.element.style.zIndex = String(Math.floor(pig.y + 24));
      }
    }

    function isBanditCellFree(row, col) {
      return row >= 1 && col >= 1 && row < worldRows - 1 && col < worldColumns - 1 &&
        (worldMap[row][col] === 1 || worldMap[row][col] === 2) &&
        objectMap[row][col] === null;
    }

    function spawnBanditMobs() {
      banditMobs = [];
      const playerX = worldPixelWidth / 2 + worldX;
      const playerY = worldPixelHeight / 2 + worldY;
      const candidates = [];
      for (let row = 1; row < worldRows - 1; row++) {
        for (let col = 1; col < worldColumns - 1; col++) {
          if (!isBanditCellFree(row, col)) continue;
          const x = (col + 0.5) * 64;
          const y = (row + 0.5) * 64;
          if (Math.hypot(x - playerX, y - playerY) >= 8 * 64) candidates.push({ x, y });
        }
      }
      // Перемешиваем кандидатов, чтобы три бандита появлялись в разных случайных местах.
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (const cell of candidates) {
        if (banditMobs.length >= BANDIT_COUNT) break;
        if (banditMobs.some(b => Math.hypot(b.x - cell.x, b.y - cell.y) < 4 * 64)) continue;
        const bandit = {
          x: cell.x, y: cell.y, health: 100,
          direction: 'down', frame: 0, frameTimer: 0,
          alerted: false, element: document.createElement('img')
        };
        bandit.element.className = 'evil-mob';
        bandit.element.alt = 'Бандит';
        bandit.element.draggable = false;
        bandit.element.src = BANDIT_SPRITES.down[0];
        bandit.element.onerror = () => console.error(`Не удалось загрузить спрайт бандита: ${bandit.element.src}`);
        objectsLayer.appendChild(bandit.element);
        banditMobs.push(bandit);
      }
      updateBanditSpritesAndPositions();
      if (banditMobs.length < BANDIT_COUNT) {
        console.warn(`Создано бандитов: ${banditMobs.length} из ${BANDIT_COUNT}. Недостаточно свободных клеток на удалении от игрока.`);
      }
    }

    function updateBanditSpritesAndPositions() {
      for (const bandit of banditMobs) {
        bandit.element.style.left = `${bandit.x}px`;
        bandit.element.style.top = `${bandit.y}px`;
        bandit.element.style.zIndex = String(Math.floor(bandit.y + 28));
      }
    }

    function canKnockPlayerTo(nextWorldX, nextWorldY) {
      const deltaX = nextWorldX - worldX;
      const deltaY = nextWorldY - worldY;
      const distance = Math.hypot(deltaX, deltaY);
      const samples = Math.max(1, Math.ceil(distance / 8));
      // Проверяем весь путь короткими шагами: отбрасывание не должно проталкивать ГГ сквозь препятствия.
      for (let i = 1; i <= samples; i++) {
        const t = i / samples;
        if (collidesAt(worldX + deltaX * t, worldY + deltaY * t)) return false;
      }
      return true;
    }

    function knockPlayerAwayFromBandit(bandit) {
      const playerX = worldPixelWidth / 2 + worldX;
      const playerY = worldPixelHeight / 2 + worldY;
      let dx = playerX - bandit.x;
      let dy = playerY - bandit.y;
      const length = Math.max(1, Math.hypot(dx, dy));
      dx /= length;
      dy /= length;

      const distance = BANDIT_KNOCKBACK_DISTANCE;
      const candidates = [
        [dx * distance, dy * distance],
        [dx * distance, 0],
        [0, dy * distance],
        [dx * distance * 0.7 - dy * distance * 0.7, dy * distance * 0.7 + dx * distance * 0.7],
        [dx * distance * 0.7 + dy * distance * 0.7, dy * distance * 0.7 - dx * distance * 0.7]
      ];
      // Сначала пытаемся оттолкнуть строго от бандита; если там дерево или камень —
      // пробуем безопасное смещение по диагонали/оси. Внутрь препятствия ГГ не переносим.
      for (const [offsetX, offsetY] of candidates) {
        const nextWorldX = worldX + offsetX;
        const nextWorldY = worldY + offsetY;
        if (!canKnockPlayerTo(nextWorldX, nextWorldY)) continue;
        worldX = nextWorldX;
        worldY = nextWorldY;
        velocityX = 0;
        velocityY = 0;
        updateCamera();
        return true;
      }
      // Если вокруг нет свободного пути, остаёмся на месте, а не застреваем в объекте.
      velocityX = 0;
      velocityY = 0;
      return false;
    }

    function knockBanditAwayFromPlayer(bandit) {
      const playerX = worldPixelWidth / 2 + worldX;
      const playerY = worldPixelHeight / 2 + worldY;
      let dx = bandit.x - playerX;
      let dy = bandit.y - playerY;
      const length = Math.max(1, Math.hypot(dx, dy));
      dx /= length;
      dy /= length;
      const nextX = bandit.x + dx * BANDIT_KNOCKBACK_DISTANCE;
      const nextY = bandit.y + dy * BANDIT_KNOCKBACK_DISTANCE;
      const col = Math.floor(nextX / 64);
      const row = Math.floor(nextY / 64);
      if (isBanditCellFree(row, col)) {
        bandit.x = nextX;
        bandit.y = nextY;
      }
    }

    function updateBanditMobs(dt) {
      if (!activeWorldId || !banditMobs.length || dt <= 0 || isPlayerDead) return;
      const playerX = worldPixelWidth / 2 + worldX;
      const playerY = worldPixelHeight / 2 + worldY;
      for (const bandit of banditMobs) {
        bandit.attackCooldown = Math.max(0, (bandit.attackCooldown || 0) - dt);
        const dx = playerX - bandit.x;
        const dy = playerY - bandit.y;
        const distance = Math.hypot(dx, dy);
        if (distance > BANDIT_DETECTION_RANGE) {
          bandit.alerted = false;
          bandit.attackWindup = 0;
          bandit.frame = 0;
          bandit.element.src = BANDIT_SPRITES[bandit.direction][0];
          continue;
        }
        bandit.alerted = true;
        if (distance > BANDIT_ATTACK_RANGE) {
          bandit.attackWindup = 0;
          const step = Math.min(distance - BANDIT_ATTACK_RANGE + 2, BANDIT_SPEED * dt);
          const nx = bandit.x + dx / distance * step;
          const ny = bandit.y + dy / distance * step;
          const col = Math.floor(nx / 64);
          const row = Math.floor(ny / 64);
          if (isBanditCellFree(row, col)) {
            bandit.x = nx;
            bandit.y = ny;
          } else {
            const xCol = Math.floor(nx / 64), currentRow = Math.floor(bandit.y / 64);
            const yRow = Math.floor(ny / 64), currentCol = Math.floor(bandit.x / 64);
            if (isBanditCellFree(currentRow, xCol)) bandit.x = nx;
            else if (isBanditCellFree(yRow, currentCol)) bandit.y = ny;
          }
          bandit.direction = Math.abs(dx) > Math.abs(dy)
            ? (dx >= 0 ? 'right' : 'left')
            : (dy >= 0 ? 'down' : 'up');
          bandit.frameTimer += dt;
          if (bandit.frameTimer >= BANDIT_FRAME_DURATION) {
            bandit.frameTimer %= BANDIT_FRAME_DURATION;
            bandit.frame = (bandit.frame + 1) % 2;
          }
        } else {
          bandit.frame = 0;
          bandit.direction = Math.abs(dx) > Math.abs(dy)
            ? (dx >= 0 ? 'right' : 'left')
            : (dy >= 0 ? 'down' : 'up');
          if (bandit.attackCooldown <= 0) {
            if (!bandit.attackWindup) bandit.attackWindup = BANDIT_ATTACK_WINDUP;
            bandit.attackWindup -= dt;
            if (bandit.attackWindup <= 0) {
              // Повторно проверяем дистанцию непосредственно в момент удара.
              const currentPlayerX = worldPixelWidth / 2 + worldX;
              const currentPlayerY = worldPixelHeight / 2 + worldY;
              if (Math.hypot(currentPlayerX - bandit.x, currentPlayerY - bandit.y) <= BANDIT_ATTACK_RANGE + 8) {
                showHitEffect(bandit.element, bandit.direction);
                applyDamage(BANDIT_ATTACK_DAMAGE, `Бандит ударил вас: −${BANDIT_ATTACK_DAMAGE} HP.`);
                if (!isPlayerDead) knockPlayerAwayFromBandit(bandit);
              }
              bandit.attackWindup = 0;
              bandit.attackCooldown = BANDIT_ATTACK_COOLDOWN;
              markSaveDirty();
            }
          }
        }
        bandit.element.src = BANDIT_SPRITES[bandit.direction][bandit.frame];
      }
      updateBanditSpritesAndPositions();
    }

    function choosePigTarget(pig) {
      for (let attempt = 0; attempt < 24; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = (1 + Math.random() * 3) * 64;
        const x = pig.homeX + Math.cos(angle) * Math.random() * pig.roamRadius;
        const y = pig.homeY + Math.sin(angle) * Math.random() * pig.roamRadius;
        const col = Math.floor(x / 64), row = Math.floor(y / 64);
        if (!isPigCellFree(row, col)) continue;
        if (Math.hypot(x - pig.x, y - pig.y) < 28) continue;
        // Не выбираем цель слишком далеко за один переход: свинья гуляет короткими отрезками.
        const targetX = pig.x + (x - pig.x) / Math.max(1, Math.hypot(x - pig.x, y - pig.y)) * Math.min(distance, Math.hypot(x - pig.x, y - pig.y));
        const targetY = pig.y + (y - pig.y) / Math.max(1, Math.hypot(x - pig.x, y - pig.y)) * Math.min(distance, Math.hypot(x - pig.x, y - pig.y));
        const targetCol = Math.floor(targetX / 64), targetRow = Math.floor(targetY / 64);
        if (!isPigCellFree(targetRow, targetCol)) continue;
        pig.targetX = targetX;
        pig.targetY = targetY;
        return;
      }
      pig.waitTimer = 1 + Math.random() * 2;
    }

    function updatePigMobs(dt) {
      if (!activeWorldId || !pigMobs.length || dt <= 0) return;
      const playerX = worldPixelWidth / 2 + worldX;
      const playerY = worldPixelHeight / 2 + worldY;
      for (const pig of pigMobs) {
        if (pig.fleeTimer > 0) {
          pig.fleeTimer = Math.max(0, pig.fleeTimer - dt);
          if (pig.fleeTimer === 0) { choosePigTarget(pig); continue; }
          const awayX = pig.x - playerX, awayY = pig.y - playerY;
          const len = Math.max(1, Math.hypot(awayX, awayY));
          const step = Math.min(110 * dt, Math.hypot(pig.targetX - pig.x, pig.targetY - pig.y));
          const nx = pig.x + awayX / len * step;
          const ny = pig.y + awayY / len * step;
          const col = Math.floor(nx / 64), row = Math.floor(ny / 64);
          if (isPigCellFree(row, col)) { pig.x = nx; pig.y = ny; }
          else { pig.fleeTimer = 0; }
          pig.direction = Math.abs(awayX) > Math.abs(awayY) ? (awayX < 0 ? 'left' : 'right') : (awayY < 0 ? 'up' : 'down');
          pig.frameTimer += dt;
          if (pig.frameTimer >= PIG_FRAME_DURATION) { pig.frameTimer %= PIG_FRAME_DURATION; pig.frame = (pig.frame + 1) % 4; }
          pig.element.src = PIG_SPRITES[pig.direction][pig.frame];
          continue;
        }
        const dx = pig.targetX - pig.x;
        const dy = pig.targetY - pig.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 4) {
          pig.waitTimer -= dt;
          pig.frame = 0;
          if (pig.waitTimer <= 0) { pig.waitTimer = 0.7 + Math.random() * 2.2; choosePigTarget(pig); }
          continue;
        }
        const step = Math.min(distance, PIG_SPEED * dt);
        const nx = pig.x + dx / distance * step;
        const ny = pig.y + dy / distance * step;
        const col = Math.floor(nx / 64), row = Math.floor(ny / 64);
        if (!isPigCellFree(row, col) || Math.hypot(nx - pig.homeX, ny - pig.homeY) > pig.roamRadius) {
          pig.targetX = pig.x; pig.targetY = pig.y; pig.waitTimer = 0.5 + Math.random(); continue;
        }
        pig.x = nx; pig.y = ny;
        pig.direction = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
        pig.frameTimer += dt;
        if (pig.frameTimer >= PIG_FRAME_DURATION) { pig.frameTimer %= PIG_FRAME_DURATION; pig.frame = (pig.frame + 1) % 4; }
        pig.element.src = PIG_SPRITES[pig.direction][pig.frame];
      }
      updatePigSpritesAndPositions();
    }

    function updateCamera() {
      const transform = `translate(calc(-50% - ${worldX}px), calc(-50% - ${worldY}px))`;
      terrainLayer.style.transform = transform;
      objectsLayer.style.transform = transform;

      // Игрок находится в координатах мира внутри objectsLayer.
      // Камера сдвигает весь слой, поэтому игрок остаётся в центре экрана.
      const playerWorldX = worldPixelWidth / 2 + worldX;
      const playerWorldY = worldPixelHeight / 2 + worldY;
      player.style.left = `${playerWorldX}px`;
      player.style.top = `${playerWorldY}px`;

      // Сравниваем точку ног игрока с основанием объектов по оси Y.
      const playerFeetY = playerWorldY + PLAYER_COLLISION_SIZE / 2;
      player.style.zIndex = String(Math.floor(playerFeetY) + 1);
    }

    // Коллизия занимает всю клетку 64×64, где есть дерево или камень.
    // Проверяем движение по осям отдельно, чтобы игрок не проскальзывал между объектами.
    function collidesAt(nextX, nextY) {
      const cellSize = 64;
      const half = PLAYER_COLLISION_SIZE / 2;
      const centerX = worldPixelWidth / 2 + nextX;
      const centerY = worldPixelHeight / 2 + nextY;
      const left = centerX - half;
      const right = centerX + half;
      const top = centerY - half;
      const bottom = centerY + half;
      const minCol = Math.floor(left / cellSize);
      const maxCol = Math.floor((right - 0.001) / cellSize);
      const minRow = Math.floor(top / cellSize);
      const maxRow = Math.floor((bottom - 0.001) / cellSize);
      for (let row = minRow; row <= maxRow; row++) {
        for (let col = minCol; col <= maxCol; col++) {
          if (row < 0 || col < 0 || row >= worldRows || col >= worldColumns) return true;
          if (objectMap[row]?.[col]) return true;
        }
      }
      const playerCenterX = centerX, playerCenterY = centerY;
      for (const pig of pigMobs) {
        if (Math.abs(playerCenterX - pig.x) < (half + 22) && Math.abs(playerCenterY - pig.y) < (half + 22)) return true;
      }
      return false;
    }

    function getPlacementTarget() {
      const centerX = worldPixelWidth / 2 + worldX;
      const centerY = worldPixelHeight / 2 + worldY;
      const offsets = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [dx, dy] = offsets[facing];
      return { col: Math.floor(centerX / 64) + dx, row: Math.floor(centerY / 64) + dy };
    }

    function canPlaceBuilding(row, col) {
      if (row < 0 || col < 0 || row >= worldRows || col >= worldColumns) return false;
      return (worldMap[row][col] === 1 || worldMap[row][col] === 2) && objectMap[row][col] === null;
    }

    function updatePlacementPreview() {
      const selected = quickSlots[selectedQuickSlot];
      if (!selected || !BUILDING_DEFINITIONS[selected.id]) {
        placementPreview.style.display = 'none';
        return;
      }
      const target = getPlacementTarget();
      placementPreview.style.left = `${target.col * 64}px`;
      placementPreview.style.top = `${target.row * 64}px`;
      placementPreview.style.display = 'block';
      placementPreview.classList.toggle('valid', canPlaceBuilding(target.row, target.col));
    }

    function placeBuilding(buildingId) {
      const definition = BUILDING_DEFINITIONS[buildingId];
      if (!definition) return;
      const target = getPlacementTarget();
      if (!canPlaceBuilding(target.row, target.col)) {
        showGameMessage('Здесь нельзя разместить объект', 'damage');
        return;
      }
      const item = inventoryItems.find(entry => entry.id === buildingId && entry.count > 0);
      if (!item) {
        showGameMessage(`${definition.name} не найден в инвентаре`, 'damage');
        return;
      }
      item.count -= 1;
      if (item.count <= 0) inventoryItems.splice(inventoryItems.indexOf(item), 1);
      for (let i = 0; i < quickSlots.length; i++) {
        if (quickSlots[i]?.id === buildingId) quickSlots[i] = null;
      }
      objectMap[target.row][target.col] = buildingId;
      const cell = objectElements[target.row]?.[target.col];
      if (cell) {
        const marker = document.createElement('img');
        marker.className = `workbench-marker ${buildingId}`;
        marker.src = definition.icon;
        marker.alt = definition.name;
        marker.draggable = false;
        marker.onerror = () => console.error(`Не удалось загрузить спрайт: ${marker.src}`);
        cell.appendChild(marker);
      }
      renderInventory();
      updatePlacementPreview();
      showGameMessage(`${definition.name} установлен${buildingId === 'anvil' ? 'а' : ''}`, 'resource');
      markSaveDirty();
    }

    function wearWeapon(weapon) {
      if (!weapon || !WEAPON_DEFINITIONS[weapon.id] || !Number.isFinite(weapon.durability)) return;
      weapon.durability = Math.max(0, weapon.durability - 1);
      if (weapon.durability === 0) {
        const itemIndex = inventoryItems.indexOf(weapon);
        if (itemIndex >= 0) inventoryItems.splice(itemIndex, 1);
        for (let slotIndex = 0; slotIndex < quickSlots.length; slotIndex++) {
          if (quickSlots[slotIndex] === weapon) quickSlots[slotIndex] = null;
        }
        showGameMessage(`${weapon.name} сломался.`, 'damage');
      } else if (weapon.durability <= weapon.maxDurability * 0.2) {
        showGameMessage(`Прочность ${weapon.name}: ${weapon.durability}/${weapon.maxDurability}`, 'damage');
      }
      renderInventory();
    }

    const HIT_HEALTH_COST = 2;
    const PLAYER_ATTACK_COOLDOWN = 1.0;
    let playerAttackCooldown = 0;
    let hitFeedbackTimer = 0;
    function performHit() {
      if (playerAttackCooldown > 0) return;
      playerAttackCooldown = PLAYER_ATTACK_COOLDOWN;
      showHitEffect(player, facing);
      const cellSize = 64;
      const centerX = worldPixelWidth / 2 + worldX;
      const centerY = worldPixelHeight / 2 + worldY;
      const offsets = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [dx, dy] = offsets[facing];
      const col = Math.floor(centerX / cellSize) + dx;
      const row = Math.floor(centerY / cellSize) + dy;
      const objectType = objectMap[row]?.[col];
      actionButton.classList.add('hit');
      hitFeedbackTimer = 0.18;

      // Животные обрабатываются отдельно: добыча дерева и камня ниже остаётся без изменений.
      const targetCenterX = (col + 0.5) * 64;
      const targetCenterY = (row + 0.5) * 64;
      const pigIndex = pigMobs.findIndex(pig => Math.hypot(pig.x - targetCenterX, pig.y - targetCenterY) < 46);
      if (pigIndex >= 0) {
        const pig = pigMobs[pigIndex];
        const selectedWeapon = quickSlots[selectedQuickSlot];
        const pigDamage = WEAPON_DEFINITIONS[selectedWeapon?.id]?.damage || 5;
        if (WEAPON_DEFINITIONS[selectedWeapon?.id]) wearWeapon(selectedWeapon);
        pig.health = Math.max(0, (Number.isFinite(pig.health) ? pig.health : 30) - pigDamage);
        showFloatingNumber(-pigDamage, 'negative', pig.element);
        showGameMessage(`${selectedWeapon && WEAPON_DEFINITIONS[selectedWeapon.id] ? selectedWeapon.name : 'Удар кулаком'}: свинья −${pigDamage} HP (${pig.health}/30).`, 'damage');
        if (pig.health <= 0) {
          pig.element.remove();
          pigMobs.splice(pigIndex, 1);
          addResource('raw_pork', 1);
          showGameMessage('Получено: Сырая свинина +1.', 'resource');
        } else {
          const playerWorldX = worldPixelWidth / 2 + worldX;
          const playerWorldY = worldPixelHeight / 2 + worldY;
          const awayX = pig.x - playerWorldX, awayY = pig.y - playerWorldY;
          const len = Math.max(1, Math.hypot(awayX, awayY));
          const knockX = pig.x + awayX / len * 64;
          const knockY = pig.y + awayY / len * 64;
          const knockCol = Math.floor(knockX / 64), knockRow = Math.floor(knockY / 64);
          if (isPigCellFree(knockRow, knockCol)) { pig.x = knockX; pig.y = knockY; }
          pig.fleeTimer = 3;
          pig.targetX = pig.x + awayX / len * 220;
          pig.targetY = pig.y + awayY / len * 220;
          pig.waitTimer = 0;
          updatePigSpritesAndPositions();
        }
        markSaveDirty();
        return;
      }

      const banditIndex = banditMobs.findIndex(bandit =>
        Math.hypot(bandit.x - targetCenterX, bandit.y - targetCenterY) < 48
      );
      if (banditIndex >= 0) {
        const bandit = banditMobs[banditIndex];
        const selectedWeapon = quickSlots[selectedQuickSlot];
        const banditDamage = WEAPON_DEFINITIONS[selectedWeapon?.id]?.damage || BANDIT_FIST_DAMAGE;
        if (WEAPON_DEFINITIONS[selectedWeapon?.id]) wearWeapon(selectedWeapon);
        bandit.health = Math.max(0, (Number.isFinite(bandit.health) ? bandit.health : 100) - banditDamage);
        showFloatingNumber(-banditDamage, 'negative', bandit.element);
        showGameMessage(`${selectedWeapon && WEAPON_DEFINITIONS[selectedWeapon.id] ? selectedWeapon.name : 'Удар кулаком'}: бандит −${banditDamage} HP (${bandit.health}/100).`, 'damage');
        if (bandit.health <= 0) {
          bandit.element.remove();
          banditMobs.splice(banditIndex, 1);
          showGameMessage('Бандит повержен.', 'resource');
        } else {
          knockBanditAwayFromPlayer(bandit);
          bandit.alerted = true;
          bandit.attackWindup = 0;
          bandit.attackCooldown = Math.max(bandit.attackCooldown || 0, BANDIT_ATTACK_COOLDOWN);
        }
        updateBanditSpritesAndPositions();
        markSaveDirty();
        return;
      }

      if (!objectType) {
        showGameMessage('Перед вами нет объекта для удара.', 'damage');
        return;
      }

      if (objectType === 'spring') {
        showGameMessage('Источник воды нельзя разрушить.', 'damage');
        return;
      }
      const isBuilding = Boolean(BUILDING_DEFINITIONS[objectType]);
      const targetKind = isBuilding ? 'building' : (objectType.startsWith('tree') ? 'tree' : 'rock');
      const targetName = targetKind === 'tree' ? 'дереву'
        : targetKind === 'rock' ? 'камню' : BUILDING_DEFINITIONS[objectType].name.toLowerCase();
      const selectedItem = quickSlots[selectedQuickSlot];
      const isAxe = Boolean(selectedItem?.toolFor === 'tree');
      const isPickaxe = Boolean(selectedItem?.toolFor === 'rock');

      // Любую установленную постройку можно разрушить топором; кирка для этого не подходит.
      if (isBuilding && isPickaxe) {
        showGameMessage('Постройку нельзя разрушить киркой. Нужен топор.', 'damage');
        return;
      }

      const correctTool = isBuilding
        ? (isAxe ? selectedItem : null)
        : (selectedItem?.toolFor === targetKind ? selectedItem : null);

      if (correctTool) {
        showGameMessage(`Вы ударили по ${targetName} инструментом: ${correctTool.name}.`, 'resource');
      } else {
        showGameMessage(`Вы ударили по ${targetName} рукой.`, 'damage');
        applyDamage(HIT_HEALTH_COST, `Вы получили ${HIT_HEALTH_COST} урона.`);
      }

      if (selectedItem && Number.isFinite(selectedItem.durability)) {
        selectedItem.durability = Math.max(0, selectedItem.durability - 1);
        if (selectedItem.durability === 0) {
          const itemIndex = inventoryItems.indexOf(selectedItem);
          if (itemIndex >= 0) inventoryItems.splice(itemIndex, 1);
          for (let slotIndex = 0; slotIndex < quickSlots.length; slotIndex++) {
            if (quickSlots[slotIndex] === selectedItem) quickSlots[slotIndex] = null;
          }
          showGameMessage(`${selectedItem.name} сломался.`, 'damage');
        } else if (selectedItem.durability <= selectedItem.maxDurability * 0.2) {
          showGameMessage(`Прочность ${selectedItem.name}: ${selectedItem.durability}/${selectedItem.maxDurability}`, 'damage');
        }
        renderInventory();
      }

      objectHitProgress[row][col] += 1;
      const required = objectHitRequired[row][col] || (targetKind === 'tree' ? 2 : 3);

      if (objectHitProgress[row][col] >= required) {
        // Любая постройка возвращает одну древесину, как и верстак.
        const amount = isBuilding ? 1 : (correctTool ? correctTool.yield : 1);
        const resourceId = targetKind === 'rock' ? 'stone' : 'wood';
        addResource(resourceId, amount);
        showFloatingNumber(amount, 'positive', objectElements[row]?.[col] || player);
        const destroyedName = targetKind === 'tree' ? 'Дерево' : targetKind === 'rock' ? 'Камень' : BUILDING_DEFINITIONS[objectType].name;
        showGameMessage(`${destroyedName} разрушен.`, 'resource');
        showGameMessage(`Получено: ${RESOURCE_NAMES[resourceId]} +${amount}.`, 'resource');

        // При добыче каждого камня отдельно проверяем шанс найти уголь и железную руду.
        // Проверки независимы: за один камень могут выпасть оба дополнительных ресурса.
        if (targetKind === 'rock' && Math.random() < 0.20) {
          addResource('coal', 1);
          showGameMessage('Найдено: Уголь +1!', 'resource');
        }
        if (targetKind === 'rock' && Math.random() < 0.05) {
          addResource('iron_ore', 1);
          showGameMessage('Найдена: Железная руда +1!', 'resource');
        }

        objectMap[row][col] = null;
        objectHitProgress[row][col] = 0;
        objectHitRequired[row][col] = 0;
        const objectCell = objectElements[row]?.[col];
        if (objectCell) objectCell.replaceChildren();
      }
      updateStatusBars();
      markSaveDirty();
    }
    const FOOD_EFFECTS = {
      raw_pork: { hunger: 5, health: 0 },
      cooked_pork: { hunger: 25, health: 20 }
    };

    function consumeSelectedFood(foodItem, effects) {
      // Сверяем быстрый слот с актуальным предметом в инвентаре.
      const inventoryItem = inventoryItems.find(entry => entry.id === foodItem?.id && entry.count > 0);
      const itemToConsume = inventoryItem || foodItem;
      if (!itemToConsume || !Number.isFinite(itemToConsume.count) || itemToConsume.count <= 0) {
        showGameMessage('Этой еды больше нет в инвентаре.', 'damage');
        return;
      }

      itemToConsume.count -= 1;
      const hungerRestored = Math.min(effects.hunger, MAX_HUNGER - hunger);
      const healthRestored = Math.min(effects.health, MAX_HEALTH - health);
      hunger = Math.min(MAX_HUNGER, hunger + effects.hunger);
      health = Math.min(MAX_HEALTH, health + effects.health);
      if (healthRestored > 0) showFloatingNumber(healthRestored, 'positive', player);
      if (hungerRestored > 0) showFloatingNumber(hungerRestored, 'positive', player);

      if (itemToConsume.count <= 0) {
        const itemIndex = inventoryItems.indexOf(itemToConsume);
        if (itemIndex >= 0) inventoryItems.splice(itemIndex, 1);
        for (let slotIndex = 0; slotIndex < quickSlots.length; slotIndex++) {
          if (quickSlots[slotIndex]?.id === itemToConsume.id) quickSlots[slotIndex] = null;
        }
      } else {
        for (let slotIndex = 0; slotIndex < quickSlots.length; slotIndex++) {
          if (quickSlots[slotIndex]?.id === itemToConsume.id) quickSlots[slotIndex] = itemToConsume;
        }
      }

      renderInventory();
      updateStatusBars();
      const restored = [];
      if (effects.hunger > 0) restored.push(`голод +${effects.hunger}`);
      if (effects.health > 0) restored.push(`здоровье +${effects.health}`);
      showGameMessage(`Съедено: ${itemToConsume.name}. Восстановлено: ${restored.join(', ')}.`, 'resource');
      markSaveDirty();
    }

    function performAction() {
      const selected = quickSlots[selectedQuickSlot];
      if (selected && BUILDING_DEFINITIONS[selected.id]) {
        placeBuilding(selected.id);
        return;
      }

      const foodEffects = selected ? FOOD_EFFECTS[selected.id] : null;
      if (foodEffects) {
        const target = getPlacementTarget();
        const objectType = objectMap[target.row]?.[target.col];
        const targetCenterX = (target.col + 0.5) * 64;
        const targetCenterY = (target.row + 0.5) * 64;
        const pigInFront = pigMobs.some(pig => Math.hypot(pig.x - targetCenterX, pig.y - targetCenterY) < 46);
        if (objectType || pigInFront) {
          performHit();
          return;
        }
        consumeSelectedFood(selected, foodEffects);
        return;
      }

      performHit();
    }

    function drinkFromSpring() {
      if (!springState) {
        showGameMessage('В этом мире нет доступного источника воды.', 'damage');
        return true;
      }
      const target = getPlacementTarget();
      if (target.row !== springState.row || target.col !== springState.col) return false;

      const now = Date.now();
      if (springState.sipsLeft <= 0 && springState.restoreAt && now >= springState.restoreAt) {
        springState.sipsLeft = SPRING_MAX_SIPS;
        springState.restoreAt = 0;
      }
      if (springState.sipsLeft <= 0) {
        const secondsLeft = Math.max(1, Math.ceil((springState.restoreAt - now) / 1000));
        showGameMessage(`Источник восстанавливается. Осталось ${secondsLeft} сек.`, 'damage');
        return true;
      }

      thirst = Math.min(MAX_THIRST, thirst + SPRING_SIP_RESTORE);
      springState.sipsLeft -= 1;
      if (springState.sipsLeft === 0) springState.restoreAt = now + SPRING_REGEN_MS;
      updateStatusBars();
      showGameMessage(`Вы выпили из источника. Жажда +${SPRING_SIP_RESTORE}. Осталось глотков: ${springState.sipsLeft}.`, 'resource');
      markSaveDirty();
      return true;
    }

    function performEat() {
      if (drinkFromSpring()) return;
      const selected = quickSlots[selectedQuickSlot];
      const effects = selected ? FOOD_EFFECTS[selected.id] : null;
      if (!effects) {
        showGameMessage('Выберите свинину в быстром слоте.', 'damage');
        return;
      }
      consumeSelectedFood(selected, effects);
    }

            ingredient.appendChild(quantity);

          });
          const button = document.createElement('button');

          button.addEventListener('click', () => craftItem(recipe));
          body.appendChild(button);

        craftOverlay.classList.add('open');

      }
      const objectName = objectType.startsWith('tree') ? 'деревом' : 'камнем';
      showGameMessage(`С ${objectName} пока нельзя взаимодействовать.`, 'damage');

    interactButton.addEventListener('click', performInteraction);

    // Не перехватываем игровые клавиши, когда пользователь вводит текст
    // (например, название мира в меню сохранений).
    function isTextEntryTarget(target) {
      return target instanceof HTMLElement && (
        target.isContentEditable || target.matches('input, textarea, select')
      );
    }

    window.addEventListener('keydown', event => {
      if (isTextEntryTarget(event.target)) return;
      if (event.key >= '1' && event.key <= '4') {
        selectedQuickSlot = Number(event.key) - 1;
        renderInventory();
      }
      if (event.code === 'Space' && !event.repeat) { event.preventDefault(); performAction(); }
      if (event.code === 'KeyE' && !event.repeat) { event.preventDefault(); performInteraction(); }
      if (event.code === 'KeyF' && !event.repeat) { event.preventDefault(); performEat(); }
      if (event.key === 'Escape') {
        inventoryOverlay.classList.remove('open');
        craftOverlay.classList.remove('open');
      }
    });

    function setDirection(direction, isDown) {
      if (isDown) pressed.add(direction);
      else pressed.delete(direction);
    }

    // Экранные стрелки поддерживают удержание мышью и пальцем.
    document.querySelectorAll('.direction').forEach((button) => {
      const direction = button.id;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture?.(event.pointerId);
        setDirection(direction, true);
      });
      const release = (event) => {
        event.preventDefault();
        setDirection(direction, false);
      };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', () => setDirection(direction, false));
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });

    window.addEventListener('keydown', (event) => {
      if (isTextEntryTarget(event.target)) return;
      const direction = keyDirections[event.code];
      if (!direction) return;
      event.preventDefault();
      pressed.add(direction);
    });
    window.addEventListener('keyup', (event) => {
      const direction = keyDirections[event.code];
      if (!direction) return;
      // Снимаем удержание даже если фокус успел перейти в текстовое поле.
      pressed.delete(direction);
      if (isTextEntryTarget(event.target)) return;
      event.preventDefault();
    });

    });

    let previousTime = 0;
    function frame(time) {
      const dt = previousTime ? Math.min((time - previousTime) / 1000, 0.033) : 0;
      previousTime = time;
      if (!isPlayerDead) {
        updateHunger(dt);
        updateThirst(dt);
      }
      if (isPlayerDead) {
        previousTime = time;
        requestAnimationFrame(frame);
        return;
      }

      updatePigMobs(dt);
      updateBanditMobs(dt);
      playerAttackCooldown = Math.max(0, playerAttackCooldown - dt);

      let inputX = (pressed.has('right') ? 1 : 0) - (pressed.has('left') ? 1 : 0);
      let inputY = (pressed.has('down') ? 1 : 0) - (pressed.has('up') ? 1 : 0);
      const inputLength = Math.hypot(inputX, inputY);
      if (inputLength > 0) {
        inputX /= inputLength;
        inputY /= inputLength;

        // Направление взгляда следует за последним активным вводом.
        if (Math.abs(inputX) > Math.abs(inputY)) facing = inputX > 0 ? 'right' : 'left';
        else facing = inputY > 0 ? 'down' : 'up';

        const dot = velocityX * inputX + velocityY * inputY;
        if (dot < 0) {
          velocityX *= Math.exp(-TURN_DRAG * dt);
          velocityY *= Math.exp(-TURN_DRAG * dt);
        }
        velocityX += inputX * ACCELERATION * dt;
        velocityY += inputY * ACCELERATION * dt;
      } else {
        const damping = Math.exp(-FRICTION * dt);
        velocityX *= damping;
        velocityY *= damping;
      }

      const speed = Math.hypot(velocityX, velocityY);
      if (speed > MAX_SPEED) {
        velocityX = velocityX / speed * MAX_SPEED;
        velocityY = velocityY / speed * MAX_SPEED;
      }

      const nextX = worldX + velocityX * dt;
      const nextY = worldY + velocityY * dt;
      if (!collidesAt(nextX, worldY)) worldX = nextX;
      else velocityX = 0;
      if (!collidesAt(worldX, nextY)) worldY = nextY;
      else velocityY = 0;

      if (pressed.size === 0 && Math.hypot(velocityX, velocityY) < 2) {
        velocityX = 0;
        velocityY = 0;
      }

      const actualSpeed = Math.hypot(velocityX, velocityY);
      if (actualSpeed > WALK_THRESHOLD) {
        animationTimer += dt;
        if (animationTimer >= WALK_FRAME_DURATION) {
          animationTimer %= WALK_FRAME_DURATION;
          animationFrame = 1 - animationFrame;
        }
      } else {
        animationTimer = 0;
        animationFrame = 0;
      }

      setPlayerSprite(facing, actualSpeed > WALK_THRESHOLD ? animationFrame : 0);
      updateCamera();
      updatePlacementPreview();
      if (hitFeedbackTimer > 0) {
        hitFeedbackTimer -= dt;
        if (hitFeedbackTimer <= 0) actionButton.classList.remove('hit');
      }
      requestAnimationFrame(frame);
    }


    // -------------------- СИСТЕМА СОХРАНЕНИЙ ROCK LAND --------------------
    const worldMenu = document.getElementById('world-menu');
    const worldSlotsElement = document.getElementById('world-slots');
    const worldMenuStatus = document.getElementById('world-menu-status');
    const worldNameDialog = document.getElementById('world-name-dialog');
    const worldNameInput = document.getElementById('world-name-input');

    function openSaveDatabase() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('Этот браузер не поддерживает IndexedDB.'));
          return;
        }
        const request = indexedDB.open(SAVE_DB_NAME, SAVE_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('worlds')) db.createObjectStore('worlds', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Не удалось открыть базу сохранений.'));
      });
    }

    function dbRequest(storeName, mode, operation) {
      return new Promise((resolve, reject) => {
        const tx = saveDatabase.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        let request;
        let result;
        try { request = operation(store); }
        catch (error) { reject(error); return; }
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => reject(request.error || new Error('Ошибка запроса к базе данных.'));
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error || new Error('Ошибка базы данных.'));
        tx.onabort = () => reject(tx.error || new Error('Транзакция базы данных отменена.'));
      });
    }

    function makeStarterInventory() {
      // Новый мир начинается с полностью пустого инвентаря.
      inventoryItems.splice(0, inventoryItems.length);
      quickSlots.fill(null);
      selectedQuickSlot = 0;
      health = MAX_HEALTH;
      isPlayerDead = false;
      deathOverlay.classList.remove('open');
      respawnX = null;
      respawnY = null;
      hunger = MAX_HUNGER;
      hungerElapsed = 0;
      starvationDamageElapsed = 0;
      starvationMessageShown = false;
      thirst = MAX_THIRST;
      thirstElapsed = 0;
      dehydrationDamageElapsed = 0;
      dehydrationMessageShown = false;
      updateStatusBars();
    }

    function serializeWorldState() {
      const quickIndexes = quickSlots.map(item => item ? inventoryItems.indexOf(item) : -1);
      return {
        schemaVersion: 1,
        savedAt: Date.now(),
        world: {
          columns: worldColumns,
          rows: worldRows,
          terrain: worldMap.map(row => row.slice()),
          objects: objectMap.map(row => row.slice()),
          hitProgress: objectHitProgress.map(row => row.slice()),
          hitRequired: objectHitRequired.map(row => row.slice()),
          spring: springState ? { ...springState } : null,
          mobs: pigMobs.map(({ x, y, homeX, homeY, roamRadius, targetX, targetY, direction, frame, frameTimer, waitTimer, health, fleeTimer }) => ({ x, y, homeX, homeY, roamRadius, targetX, targetY, direction, frame, frameTimer, waitTimer, health, fleeTimer })),
          bandits: banditMobs.map(({ x, y, health, direction, frame, frameTimer, alerted, attackWindup, attackCooldown }) => ({ x, y, health, direction, frame, frameTimer, alerted, attackWindup, attackCooldown }))
        },
        player: {
          x: worldX, y: worldY, health, hunger,
          respawnX, respawnY,
          hungerElapsed, starvationDamageElapsed,
          thirst, thirstElapsed, dehydrationDamageElapsed,
          facing,
          selectedQuickSlot,
          quickIndexes
        },
        inventory: inventoryItems.map(item => ({ ...item }))
      };
    }

    function isValidWorldState(state) {
      if (!state || state.schemaVersion !== 1 || !state.world || !state.player) return false;
      const rows = state.world.rows, cols = state.world.columns;
      if (rows !== 32 || cols !== 32) return false;
      const validGrid = grid => Array.isArray(grid) && grid.length === rows &&
        grid.every(row => Array.isArray(row) && row.length === cols);
      return validGrid(state.world.terrain) && validGrid(state.world.objects) &&
        validGrid(state.world.hitProgress) && validGrid(state.world.hitRequired) &&
        Array.isArray(state.inventory) && state.inventory.length <= 16 &&
        Array.isArray(state.player.quickIndexes) && state.player.quickIndexes.length === 4 &&
        Number.isFinite(state.player.x) && Number.isFinite(state.player.y) &&
        Number.isFinite(state.player.health);
    }

    function renderWorldFromState() {
      const cellSize = 64;
      worldRows = worldMap.length;
      worldColumns = worldMap[0]?.length || 0;
      worldPixelWidth = worldColumns * cellSize;
      worldPixelHeight = worldRows * cellSize;
      objectElements = Array.from({ length: worldRows }, () => Array(worldColumns).fill(null));
      const terrainFragment = document.createDocumentFragment();
      const objectFragment = document.createDocumentFragment();

      for (let row = 0; row < worldRows; row++) {
        for (let col = 0; col < worldColumns; col++) {
          const tileId = worldMap[row][col];
          const terrainCell = document.createElement('div');
          terrainCell.className = 'cell';
          terrainCell.dataset.tile = String(tileId);
          terrainCell.style.backgroundImage = `url("${TILE_TEXTURES[tileId]}")`;
          terrainFragment.appendChild(terrainCell);

          const objectType = objectMap[row][col];
          const objectCell = document.createElement('div');
          objectCell.className = 'object-cell';
          objectCell.dataset.row = String(row);
          objectCell.dataset.col = String(col);
          objectCell.style.zIndex = String((row + 1) * 64);
          if (objectType) {
            const sprite = document.createElement('img');
            if (BUILDING_DEFINITIONS[objectType]) {
              sprite.className = `workbench-marker ${objectType}`;
              sprite.src = BUILDING_DEFINITIONS[objectType].icon;
              sprite.alt = BUILDING_DEFINITIONS[objectType].name;
            } else {
              sprite.className = `world-object ${objectType === 'tree1' ? 'tree-1' : objectType === 'tree2' ? 'tree-2' : objectType === 'spring' ? 'spring' : 'rock'}`;
              sprite.src = OBJECT_SPRITES[objectType];
              sprite.alt = objectType === 'spring' ? 'Источник воды' : '';
            }
            sprite.draggable = false;
            objectCell.appendChild(sprite);
          }
          objectElements[row][col] = objectCell;
          objectFragment.appendChild(objectCell);
        }
      }

      terrainLayer.replaceChildren(terrainFragment);
      objectsLayer.replaceChildren(objectFragment);
      objectsLayer.appendChild(player);
      objectsLayer.appendChild(placementPreview);
      for (const layer of [terrainLayer, objectsLayer]) {
        layer.style.gridTemplateColumns = `repeat(${worldColumns}, var(--cell-size))`;
        layer.style.gridTemplateRows = `repeat(${worldRows}, var(--cell-size))`;
        layer.style.width = `${worldPixelWidth}px`;
        layer.style.height = `${worldPixelHeight}px`;
      }
      updateCamera();
      updatePlacementPreview();
    }

    async function saveCurrentWorld(force = false) {
      if (!activeWorldId || !saveDatabase || saveInProgress || (!saveDirty && !force)) return true;
      saveInProgress = true;
      const snapshot = serializeWorldState();
      try {
        await new Promise((resolve, reject) => {
          const tx = saveDatabase.transaction('worlds', 'readwrite');
          const store = tx.objectStore('worlds');
          const getRequest = store.get(activeWorldId);
          getRequest.onsuccess = () => {
            const record = getRequest.result;
            if (!record) {
              reject(new Error('Слот мира не найден.'));
              tx.abort();
              return;
            }
            if (record.state && isValidWorldState(record.state)) record.backup = record.state;
            record.state = snapshot;
            record.updatedAt = Date.now();
            record.name = activeWorldName;
            store.put(record);
          };
          getRequest.onerror = () => reject(getRequest.error);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Не удалось сохранить мир.'));
          tx.onabort = () => reject(tx.error || new Error('Сохранение отменено.'));
        });
        saveDirty = false;
        lastSavedAt = Date.now();
        return true;
      } catch (error) {
        console.error('Rock Land save error:', error);
        worldMenuStatus.textContent = 'Ошибка сохранения. Попробуйте ещё раз.';
        showGameMessage('Ошибка сохранения мира!', 'damage');
        return false;
      } finally {
        saveInProgress = false;
      }
    }

    function markSaveDirty() {
      if (!activeWorldId) return;
      saveDirty = true;
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => { saveCurrentWorld(); }, 700);
    }

    async function refreshWorldMenu() {
      const records = await dbRequest('worlds', 'readonly', store => store.getAll());
      records.sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
      worldSlotsElement.replaceChildren();
      for (let index = 0; index < MAX_WORLDS; index++) {
        const record = records[index];
        const slot = document.createElement('div');
        slot.className = 'world-slot';
        const info = document.createElement('div');
        info.className = 'world-slot-info';
        const name = document.createElement('div');
        name.className = 'world-slot-name';
        name.textContent = record ? record.name : `СЛОТ ${index + 1} — ПУСТО`;
        info.appendChild(name);
        const meta = document.createElement('div');
        meta.className = 'world-slot-meta';
        meta.textContent = record
          ? `Последнее сохранение: ${new Date(record.updatedAt || record.createdAt).toLocaleString('ru-RU')}`
          : 'Можно создать новый мир';
        info.appendChild(meta);
        slot.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'world-slot-actions';
        if (record) {
          const play = document.createElement('button');
          play.className = 'world-menu-button';
          play.textContent = 'ИГРАТЬ';
          play.addEventListener('click', () => loadWorld(record.id));
          actions.appendChild(play);

          const remove = document.createElement('button');
          remove.className = 'world-menu-button danger';
          remove.textContent = 'УДАЛИТЬ';
          remove.addEventListener('click', async () => {
            if (!confirm(`Удалить мир «${record.name}»? Это действие нельзя отменить.`)) return;
            await dbRequest('worlds', 'readwrite', store => store.delete(record.id));
            worldMenuStatus.textContent = 'Мир удалён.';
            refreshWorldMenu();
          });
          actions.appendChild(remove);
        } else {
          const create = document.createElement('button');
          create.className = 'world-menu-button';
          create.textContent = 'СОЗДАТЬ';
          create.disabled = records.length >= MAX_WORLDS;
          create.addEventListener('click', () => {
            worldNameDialog.classList.add('open');
            worldNameInput.value = `Мир ${index + 1}`;
            worldNameInput.focus();
          });
          actions.appendChild(create);
        }
        slot.appendChild(actions);
        worldSlotsElement.appendChild(slot);
      }
      const count = Math.min(records.length, MAX_WORLDS);
      worldMenuStatus.textContent = `${count} / ${MAX_WORLDS} миров занято`;
    }

    async function createNewWorld(name) {
      const records = await dbRequest('worlds', 'readonly', store => store.getAll());
      if (records.length >= MAX_WORLDS) {
        worldMenuStatus.textContent = 'Все пять слотов заняты. Удалите один мир.';
        return;
      }
      makeStarterInventory();
      generateWorld();
      activeWorldId = (window.crypto?.randomUUID ? window.crypto.randomUUID() : `world_${Date.now()}_${Math.random().toString(16).slice(2)}`);
      activeWorldName = name.trim().slice(0, 32) || `Мир ${records.length + 1}`;
      const now = Date.now();
      const record = {
        id: activeWorldId, name: activeWorldName, createdAt: now, updatedAt: now,
        state: serializeWorldState(), backup: null
      };
      await dbRequest('worlds', 'readwrite', store => store.add(record));
      saveDirty = false;
      lastSavedAt = now;
      worldNameDialog.classList.remove('open');
      worldMenu.hidden = true;
      document.getElementById('game').style.display = '';
      renderInventory();
      startWorldTimers();
      showGameMessage(`Мир «${activeWorldName}» создан.`, 'resource');
    }

    async function loadWorld(worldId) {
      worldMenuStatus.textContent = 'Загрузка мира...';
      const record = await dbRequest('worlds', 'readonly', store => store.get(worldId));
      if (!record) {
        worldMenuStatus.textContent = 'Мир не найден.';
        return;
      }
      if (!isValidWorldState(record.state)) {
        if (record.backup && isValidWorldState(record.backup)) {
          const restore = confirm(`Основное сохранение мира «${record.name}» повреждено. Восстановить резервную копию?`);
          if (!restore) return;
          record.state = record.backup;
          await dbRequest('worlds', 'readwrite', store => store.put(record));
        } else {
          worldMenuStatus.textContent = 'Сохранение повреждено, резервной копии нет.';
          return;
        }
      }
      const state = record.state;
      activeWorldId = record.id;
      activeWorldName = record.name;
      worldMap = state.world.terrain.map(row => row.slice());
      objectMap = state.world.objects.map(row => row.slice());
      objectHitProgress = state.world.hitProgress.map(row => row.slice());
      objectHitRequired = state.world.hitRequired.map(row => row.slice());
      springState = state.world.spring ? { ...state.world.spring } : null;
      if (!springState) {
        for (let row = 0; row < worldRows && !springState; row++) {
          for (let col = 0; col < worldColumns; col++) {
            if (objectMap[row][col] === 'spring') {
              springState = { row, col, sipsLeft: SPRING_MAX_SIPS, restoreAt: 0 };
              break;
            }
          }
        }
      }
      if (!springState) {
        const candidates = [];
        for (let row = 0; row < worldRows; row++) {
          for (let col = 0; col < worldColumns; col++) {
            if (worldMap[row][col] === 3 && (!objectMap[row][col] || objectMap[row][col] === 'rock1' || objectMap[row][col] === 'rock2')) {
              candidates.push({ row, col });
            }
          }
        }
        if (candidates.length) {
          const cell = candidates[Math.floor(Math.random() * candidates.length)];
          objectMap[cell.row][cell.col] = 'spring';
          objectHitProgress[cell.row][cell.col] = 0;
          objectHitRequired[cell.row][cell.col] = 0;
          springState = { ...cell, sipsLeft: SPRING_MAX_SIPS, restoreAt: 0 };
        }
      }
      inventoryItems.splice(0, inventoryItems.length, ...state.inventory.map(item => ({ ...item })));
      quickSlots.splice(0, quickSlots.length, ...state.player.quickIndexes.map(index => index >= 0 ? inventoryItems[index] || null : null));
      while (quickSlots.length < 4) quickSlots.push(null);
      selectedQuickSlot = Math.max(0, Math.min(3, state.player.selectedQuickSlot || 0));
      worldX = state.player.x;
      worldY = state.player.y;
      if (Number.isFinite(state.player.respawnX) && Number.isFinite(state.player.respawnY)) {
        respawnX = state.player.respawnX;
        respawnY = state.player.respawnY;
      } else {
        // Для старых сохранений восстанавливаем исходную точку появления в центре карты.
        const rows = objectMap.length;
        const columns = objectMap[0]?.length || 0;
        const centerRow = Math.floor(rows / 2);
        const centerCol = Math.floor(columns / 2);
        let spawn = null;
        for (let radius = 0; radius < Math.max(rows, columns) && !spawn; radius++) {
          for (let row = Math.max(0, centerRow - radius); row <= Math.min(rows - 1, centerRow + radius) && !spawn; row++) {
            for (let col = Math.max(0, centerCol - radius); col <= Math.min(columns - 1, centerCol + radius); col++) {
              if (objectMap[row][col] === null) { spawn = { row, col }; break; }
            }
          }
        }
        respawnX = spawn ? (spawn.col + 0.5) * 64 - columns * 64 / 2 : 0;
        respawnY = spawn ? (spawn.row + 0.5) * 64 - rows * 64 / 2 : 0;
      }
      isPlayerDead = false;
      deathOverlay.classList.remove('open');
      health = Math.max(0, Math.min(MAX_HEALTH, Number(state.player.health) || 0));
      if (health <= 0) health = MAX_HEALTH;
      hunger = Math.max(0, Math.min(MAX_HUNGER, Number.isFinite(state.player.hunger) ? state.player.hunger : MAX_HUNGER));
      hungerElapsed = Math.max(0, Math.min(HUNGER_TICK_SECONDS, Number(state.player.hungerElapsed) || 0));
      starvationDamageElapsed = Math.max(0, Math.min(STARVATION_DAMAGE_INTERVAL, Number(state.player.starvationDamageElapsed) || 0));
      starvationMessageShown = hunger <= 0;
      thirst = Math.max(0, Math.min(MAX_THIRST, Number.isFinite(state.player.thirst) ? state.player.thirst : MAX_THIRST));
      thirstElapsed = Math.max(0, Math.min(THIRST_TICK_SECONDS, Number(state.player.thirstElapsed) || 0));
      dehydrationDamageElapsed = Math.max(0, Math.min(DEHYDRATION_DAMAGE_INTERVAL, Number(state.player.dehydrationDamageElapsed) || 0));
      dehydrationMessageShown = thirst <= 0;
      updateStatusBars();
      facing = ['up','down','left','right'].includes(state.player.facing) ? state.player.facing : 'down';
      velocityX = 0;
      velocityY = 0;
      renderWorldFromState();
      renderInventory();
      if (Array.isArray(state.world.mobs) && state.world.mobs.length) {
        pigMobs = state.world.mobs.map(data => {
          const pig = { health: 30, fleeTimer: 0, ...data, element: document.createElement('img') };
          pig.element.className = 'good-mob'; pig.element.alt = ''; pig.element.draggable = false;
          pig.element.src = (PIG_SPRITES[pig.direction] || PIG_SPRITES.down)[pig.frame % 4];
          pig.element.onerror = () => console.error(`Не удалось загрузить спрайт свиньи: ${pig.element.src}`);
          objectsLayer.appendChild(pig.element);
          return pig;
        });
        updatePigSpritesAndPositions();
      } else { spawnPigMobs(); }
      banditMobs = [];
      if (Array.isArray(state.world.bandits) && state.world.bandits.length) {
        banditMobs = state.world.bandits.map(data => {
          const bandit = { health: 100, direction: 'down', frame: 0, frameTimer: 0, alerted: false, attackWindup: 0, attackCooldown: 0, ...data, element: document.createElement('img') };
          bandit.element.className = 'evil-mob';
          bandit.element.alt = 'Бандит';
          bandit.element.draggable = false;
          bandit.element.src = (BANDIT_SPRITES[bandit.direction] || BANDIT_SPRITES.down)[bandit.frame % 2];
          bandit.element.onerror = () => console.error(`Не удалось загрузить спрайт бандита: ${bandit.element.src}`);
          objectsLayer.appendChild(bandit.element);
          return bandit;
        });
        updateBanditSpritesAndPositions();
      } else { spawnBanditMobs(); }
      currentSprite = '';
      setPlayerSprite(facing, 0);
      saveDirty = false;
      worldMenu.hidden = true;
      document.getElementById('game').style.display = '';
      startWorldTimers();
      worldMenuStatus.textContent = '';
      showGameMessage(`Мир «${activeWorldName}» загружен.`, 'resource');
    }

    function startWorldTimers() {
      clearInterval(autoSaveTimer);
      autoSaveTimer = setInterval(() => saveCurrentWorld(true), SAVE_INTERVAL_MS);
    }

    async function returnToWorldMenu() {
      clearTimeout(saveDebounceTimer);
      const saved = await saveCurrentWorld(true);
      if (!saved) return;
      clearInterval(autoSaveTimer);
      activeWorldId = null;
      activeWorldName = '';
      pressed.clear();
      inventoryOverlay.classList.remove('open');
      craftOverlay.classList.remove('open');
      devOverlay.classList.remove('open');
      document.getElementById('game').style.display = 'none';
      worldMenu.hidden = false;
      await refreshWorldMenu();
    }

    async function initializeSaveSystem() {
      try {
        saveDatabase = await openSaveDatabase();
        // Настройки хранятся отдельно и общие для всех миров.
        const settings = await dbRequest('settings', 'readonly', store => store.get('global'));
        if (!settings) await dbRequest('settings', 'readwrite', store => store.put({ id: 'global', values: {} }));
        document.getElementById('world-save-button').addEventListener('click', async () => {
          const saved = await saveCurrentWorld(true);
          if (saved) showGameMessage('Мир сохранён.', 'resource');
        });
        document.getElementById('world-exit-button').addEventListener('click', returnToWorldMenu);
        document.getElementById('world-create-confirm').addEventListener('click', async () => {
          try { await createNewWorld(worldNameInput.value); }
          catch (error) { console.error(error); worldMenuStatus.textContent = 'Не удалось создать мир.'; }
        });
        document.getElementById('world-create-cancel').addEventListener('click', () => worldNameDialog.classList.remove('open'));
        worldNameInput.addEventListener('keydown', event => {
          if (event.key === 'Enter') document.getElementById('world-create-confirm').click();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && activeWorldId) saveCurrentWorld(true);
        });
        window.addEventListener('pagehide', () => {
          // Best-effort only: браузер может завершить страницу до окончания асинхронной записи.
          if (activeWorldId && saveDatabase && saveDirty) saveCurrentWorld(true);
        });
        worldMenu.hidden = false;
        await refreshWorldMenu();
      } catch (error) {
        console.error('Rock Land storage initialization failed:', error);
        worldMenu.hidden = false;
        worldMenuStatus.textContent = 'Не удалось открыть локальное хранилище. Проверьте поддержку IndexedDB.';
      }
    }
    // ------------------ КОНЕЦ СИСТЕМЫ СОХРАНЕНИЙ ------------------

    // Предзагружаем графику, чтобы смена кадров не мигала.
    [...Object.values(TILE_TEXTURES), ...Object.values(PLAYER_SPRITES).flat(), ...Object.values(PIG_SPRITES).flat(), ...Object.values(BANDIT_SPRITES).flat(), ...Object.values(OBJECT_SPRITES), ...Object.values(TOOL_DEFINITIONS).map(tool => tool.icon), ...Object.values(WEAPON_DEFINITIONS).map(weapon => weapon.icon), ...Object.values(RESOURCE_ICONS)].forEach((src) => {
      const image = new Image();
      image.onerror = () => console.error(`Не удалось загрузить изображение: ${src}`);
      image.src = src;
    });

    window.addEventListener('resize', () => { updateCamera(); updatePlacementPreview(); });
    setPlayerSprite('down', 0);
    renderInventory();
    document.getElementById('game').style.display = 'none';
    initializeSaveSystem();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
